<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F2F6F5">
<title>Kasente</title>
<style>
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Bricolage Grotesque';src:url(fonts/bricolage-grotesque-latin-800-normal.woff2) format('woff2');font-weight:800;font-display:swap}
@font-face{font-family:'Figtree';src:url(fonts/figtree-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Figtree';src:url(fonts/figtree-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Figtree';src:url(fonts/figtree-latin-600-normal.woff2) format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Figtree';src:url(fonts/figtree-latin-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format('woff2');font-weight:500;font-display:swap}
/* Layout: one phone-sized app column (lake-teal ink, marigold action colour, a woven barkcloth texture on the net-worth card) centred on a quiet stage, with a module guide rail on wide screens */
:root{
  --stage:#DCE5E2; --bg:#F2F6F5; --surface:#FFFFFF; --surface-2:#E7EEEC; --line:#D4DEDB;
  --ink:#0F2624; --muted:#566C69; --faint:#8A9E9A;
  --accent:#0E6B66; --accent-ink:#FFFFFF; --accent-soft:#D5EBE8;
  --sun:#E6A21C; --sun-ink:#231803; --sun-soft:#FBEFD3;
  --good:#1F7F4B; --good-soft:#DAF0E2; --warn:#A86C05; --warn-soft:#FBEBCB; --bad:#BD3628; --bad-soft:#F8DEDA;
  --hero:#0A4845; --hero-2:#0F6A64; --hero-ink:#F4FAF8; --hero-muted:#A8CEC9;
  --shadow:0 1px 2px rgba(15,38,36,.05),0 10px 30px -12px rgba(15,38,36,.18);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#050D0C; --bg:#0A1514; --surface:#12211F; --surface-2:#1A2D2A; --line:#244039;
  --ink:#E4EEEB; --muted:#94ABA6; --faint:#62807A;
  --accent:#3FB7AC; --accent-ink:#03201D; --accent-soft:#153936;
  --sun:#F0B84A; --sun-ink:#231803; --sun-soft:#3A2D12;
  --good:#4FC683; --good-soft:#133524; --warn:#EBAB3C; --warn-soft:#3A2B10; --bad:#F06C5D; --bad-soft:#3D1A16;
  --hero:#0B3633; --hero-2:#11544E; --hero-ink:#F0F8F6; --hero-muted:#9CC6BF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --stage:#050D0C; --bg:#0A1514; --surface:#12211F; --surface-2:#1A2D2A; --line:#244039;
  --ink:#E4EEEB; --muted:#94ABA6; --faint:#62807A;
  --accent:#3FB7AC; --accent-ink:#03201D; --accent-soft:#153936;
  --sun:#F0B84A; --sun-ink:#231803; --sun-soft:#3A2D12;
  --good:#4FC683; --good-soft:#133524; --warn:#EBAB3C; --warn-soft:#3A2B10; --bad:#F06C5D; --bad-soft:#3D1A16;
  --hero:#0B3633; --hero-2:#11544E; --hero-ink:#F0F8F6; --hero-muted:#9CC6BF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;background:var(--stage);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.num,.tnum{font-variant-numeric:tabular-nums}
.i{flex:none;display:block}

/* stage + phone */
.stage{height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding-block:20px;padding-inline:16px}
.phone{position:relative;width:100%;max-width:420px;height:100%;max-height:900px;background:var(--bg);border:1px solid var(--line);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 40px 90px -40px rgba(8,40,37,.55)}
@media (max-width:520px){.stage{padding:0}.phone{max-width:none;max-height:none;border:0;border-radius:0;box-shadow:none}}

/* guide rail */
.guide{width:300px;flex:none;display:none;max-height:100%;overflow:auto;padding-block:8px}
@media (min-width:1000px){.guide{display:block}}
.guide-brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:26px}
.guide p{color:var(--muted);margin-top:12px;max-width:34ch;font-size:14px}
.guide-list{list-style:none;margin:22px 0 0;padding:0;display:grid;gap:2px}
.guide-list button{width:100%;display:grid;grid-template-columns:42px 1fr;align-items:center;padding:8px 10px;border-radius:10px;font-weight:500;font-size:14px;color:var(--ink)}
.guide-list button:hover{background:var(--surface)}
.guide-list span{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.guide-foot{margin-top:18px;font-size:12px;color:var(--faint)}

/* top bar */
.top{flex:none;display:flex;align-items:center;gap:10px;padding:18px 16px 10px;min-height:68px}
.top-title{font-size:26px;font-weight:800;flex:1;min-width:0}
.top-title.sm{font-size:19px;font-weight:700}
.top-actions{display:flex;gap:6px;margin-left:auto}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.icon-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid var(--bg)}
.greet{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.greet-hi{font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.greet-sub{color:var(--muted);font-size:12.5px}
.logo-mark{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:21px;flex:none;position:relative;overflow:hidden}
.logo-mark::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--sun);right:-3px;bottom:-3px}
.logo-mark.lg{width:64px;height:64px;font-size:36px;border-radius:20px}
.logo-mark.lg::after{width:20px;height:20px;right:-5px;bottom:-5px}

/* view */
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 16px 118px;overscroll-behavior:contain}
.screen{display:flex;flex-direction:column;gap:14px;animation:fade .22s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}

/* nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);align-items:end;padding:8px 8px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:20}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--faint);padding:6px 0;border-radius:12px}
.nav button.on{color:var(--accent)}
.nav .fab{width:58px;height:58px;border-radius:20px;background:var(--sun);color:var(--sun-ink);justify-self:center;justify-content:center;margin-top:-28px;box-shadow:0 10px 24px -8px color-mix(in srgb,var(--sun) 70%,transparent);padding:0}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:8px 2px -4px}
.sec-head h2{font-size:17px;font-weight:700}
.link{color:var(--accent);font-weight:600;font-size:14px}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.sun{background:var(--sun-soft);color:var(--warn)}
.src{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);margin-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:14px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.bar>i{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--accent)}
.bar.thick{height:12px}
.pace{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.55;border-radius:2px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:18px 18px 16px;background:linear-gradient(150deg,var(--hero),var(--hero-2));color:var(--hero-ink)}
.hero::before{content:"";position:absolute;inset:0;opacity:.16;pointer-events:none;background-image:repeating-linear-gradient(45deg,var(--sun) 0 2px,transparent 2px 16px),repeating-linear-gradient(-45deg,var(--hero-ink) 0 1px,transparent 1px 16px);-webkit-mask-image:linear-gradient(105deg,transparent 40%,#000 95%);mask-image:linear-gradient(105deg,transparent 40%,#000 95%)}
.hero>*{position:relative}
.hero .eyebrow{color:var(--hero-muted)}
.hero-num{font-family:var(--f-display);font-weight:800;font-size:36px;letter-spacing:-.02em;line-height:1.05;margin-top:6px;font-variant-numeric:tabular-nums}
.hero-num small{font-size:16px;font-weight:600;color:var(--hero-muted);margin-right:6px;letter-spacing:0}
.hero-delta{font-size:13px;color:var(--hero-muted);margin-top:4px}
.hero-delta b{color:var(--sun);font-weight:700}
.hero-spark{margin:10px -4px 4px;height:54px}
.hero-foot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid color-mix(in srgb,var(--hero-ink) 18%,transparent);padding-top:12px}
.hero-foot span{display:block;font-size:11px;color:var(--hero-muted)}
.hero-foot b{font-size:14px;font-variant-numeric:tabular-nums}
.ghost-pill{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--hero-ink) 14%,transparent);color:var(--hero-ink)}

/* accounts rail */
.rail{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.acct{flex:none;width:158px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.acct-head{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px}
.acct-dot{width:10px;height:10px;border-radius:3px;flex:none}
.acct-type{font-size:11.5px;color:var(--muted)}
.acct-bal{font-weight:700;font-size:16px;margin-top:6px;font-variant-numeric:tabular-nums}
.acct.add{align-items:center;justify-content:center;border-style:dashed;color:var(--accent);font-weight:600;gap:6px;width:110px}

/* quick actions */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;color:var(--ink)}
.qa .qi{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--accent)}

/* tx rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.tx{width:100%;display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line)}
.list>:last-child{border-bottom:0}
.chip{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.chip.sm{width:32px;height:32px;border-radius:10px}
.tx-main{min-width:0;display:flex;flex-direction:column}
.tx-title{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-amt{font-weight:700;font-variant-numeric:tabular-nums;font-size:14.5px;text-align:right}
.tx-amt.pos{color:var(--good)}
.tx-amt small{display:block;font-size:11px;font-weight:600;color:var(--muted)}
.day-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--muted);margin:6px 4px -6px}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.input,.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:13px;border:1px solid var(--line);background:var(--bg);padding:10px 12px;font-size:15px;outline:none}
.field textarea{resize:vertical;min-height:70px;line-height:1.4}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;min-height:44px;outline:none;color:var(--ink)}
.seg{display:flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;min-height:36px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--muted);text-align:center;padding:0 8px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chipbtn{flex:none;min-height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chipbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.toggle{width:46px;height:28px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);position:relative;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.toggle.on{background:var(--accent);border-color:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* settings rows */
.setrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%}
.setrow .grow b{display:block;font-weight:600;font-size:14.5px}
.setrow .grow span{display:block;font-size:12.5px;color:var(--muted)}

/* sheet */
.overlay{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(5,20,18,.45);animation:fadein .18s}
.sheet{background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
.sheet-head::before{content:"";position:absolute;left:50%;transform:translateX(-50%);margin-top:-22px;width:40px;height:4px;border-radius:4px;background:var(--line)}
.sheet-head h3{font-size:19px;flex:1}
.sheet-body{overflow:auto;padding:4px 16px calc(22px + env(safe-area-inset-bottom,0px))}
@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:60;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:14px;font-size:13.5px;font-weight:500;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow);animation:up .25s}

/* misc components */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-size:12px;line-height:1.55;background:var(--surface-2);border-radius:12px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--accent-soft);color:var(--ink);font-size:13.5px}
.note .i{color:var(--accent);margin-top:1px}
.note.warn{background:var(--warn-soft)}
.note.warn .i{color:var(--warn)}
.note.bad{background:var(--bad-soft)}
.note.bad .i{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:118px}
.tile b{font-size:14.5px;font-weight:700}
.tile span{font-size:12px;color:var(--muted);line-height:1.35}
.tile .tile-ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.tile em{font-style:normal;font-size:11px;font-weight:700;color:var(--warn);margin-top:auto}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.stat span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.stat b{display:block;font-size:15px;font-variant-numeric:tabular-nums;margin-top:2px}
.insight{display:flex;gap:12px;align-items:flex-start;background:var(--sun-soft);border-radius:20px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--sun) 30%,transparent)}
.insight .i{color:var(--warn);margin-top:2px}
.bill{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);width:100%}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dow{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.05em}
.cal .d{aspect-ratio:1;max-width:100%;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;position:relative;color:var(--ink)}
.cal .d.today{background:var(--ink);color:var(--bg)}
.cal .d.has::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--sun);position:absolute;bottom:4px}
.cal .d.over::after{background:var(--bad)}
.cal .d.paid::after{background:var(--good)}
.cal .d.muted{color:var(--faint)}

.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 13px;border-radius:18px;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg ul{margin:6px 0 0;padding-left:18px}
.msg .meta{display:block;font-size:10.5px;opacity:.7;margin-top:4px;text-align:right}
.typing span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.composer{position:sticky;bottom:-118px;display:flex;gap:8px;align-items:center;background:var(--bg);padding:10px 0 4px}
.composer input{flex:1;min-width:0;min-height:48px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 14px;outline:none}
.composer input:focus{border-color:var(--accent)}
.send{width:48px;height:48px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.wa{background:var(--surface-2);border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px;background-image:radial-gradient(color-mix(in srgb,var(--faint) 22%,transparent) 1px,transparent 1px);background-size:14px 14px}
.wa .msg.me{background:var(--good-soft);color:var(--ink)}
.wa-head{display:flex;align-items:center;gap:10px;padding:4px 4px 8px;border-bottom:1px solid var(--line)}
.wa-av{width:38px;height:38px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}

/* charts */
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:12.5px}
.legend div{display:flex;align-items:center;gap:6px;min-width:0}
.legend i{width:9px;height:9px;border-radius:3px;flex:none}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.legend b{font-variant-numeric:tabular-nums;font-weight:600}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:6px;display:block;max-width:100%}
.stackbar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;background:var(--accent-soft);color:var(--accent);flex:none}

.receipt{font-family:var(--f-mono);font-size:11.5px;background:#FFFDF6;color:#2A2A2A;padding:14px 14px 18px;border-radius:6px;box-shadow:0 6px 20px -8px rgba(0,0,0,.35);transform:rotate(-1.2deg);max-width:240px;margin:6px auto 10px;line-height:1.5;-webkit-mask-image:linear-gradient(#000 92%,transparent)}
.receipt .c{text-align:center}
.receipt .r{display:flex;justify-content:space-between;gap:8px}
.receipt hr{border:0;border-top:1px dashed #999;margin:6px 0}
.drop{border:2px dashed var(--line);border-radius:20px;padding:22px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--surface);cursor:pointer}
.drop .i{color:var(--accent)}
.thumb{width:100%;max-height:220px;object-fit:contain;border-radius:14px;background:var(--surface-2)}
.itemrow{display:grid;grid-template-columns:1fr 104px 30px;gap:6px;align-items:center}
.itemrow input{min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:6px 10px;width:100%;min-width:0;font-size:14px}

/* lock + onboarding */
.lock{position:absolute;inset:0;z-index:80;background:linear-gradient(170deg,var(--hero),var(--hero-2));color:var(--hero-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px}
.lock-name{font-family:var(--f-display);font-weight:800;font-size:28px;text-align:center;margin-top:10px}
.lock p{color:var(--hero-muted);text-align:center;font-size:14px}
.pin-dots{display:flex;gap:16px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--hero-ink);opacity:.8}
.pin-dots i.f{background:var(--sun);border-color:var(--sun);opacity:1}
.pin-dots.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.keypad button{width:72px;height:72px;border-radius:50%;background:color-mix(in srgb,var(--hero-ink) 10%,transparent);color:var(--hero-ink);font-size:26px;font-family:var(--f-display);font-weight:600;display:grid;place-items:center}
.keypad button:disabled{opacity:.35}
.onb{position:absolute;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;padding:28px 20px 24px}
.onb-art{flex:1;display:grid;place-items:center}
.onb h2{font-size:28px;font-weight:800;line-height:1.1}
.onb p{color:var(--muted);margin-top:10px;max-width:36ch}
.dots{display:flex;gap:6px;margin:20px 0}
.dots i{width:8px;height:8px;border-radius:4px;background:var(--line)}
.dots i.on{width:22px;background:var(--accent)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

.guide{display:none!important}
.stage{padding:0}
.phone{max-width:none;max-height:none;border:0;border-radius:0;box-shadow:none}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

function parseSMS(raw){
 const s=raw.replace(/\s+/g,' ').trim();
 const am=s.match(/UGX\s?([\d,]+(?:\.\d+)?)/i);if(!am)return null;
 const amt=+am[1].replace(/,/g,'');
 let kind='out',type='Sent';
 if(/received/i.test(s)){kind='in';type='Received'}
 else if(/withdr[ae]w/i.test(s))type='Withdrawn';
 else if(/\bpaid\b|payment/i.test(s))type='Paid to merchant';
 else if(/deposit/i.test(s)){kind='in';type='Deposited'}
 const party=(s.match(/\b(?:to|from)\s+([A-Z][A-Z0-9&.' -]{2,}?)(?=\s+(?:256)?\d{6,}|\s+on\b|[.,]|$)/)||[])[1];
 const dm=s.match(/(\d{2})\/(\d{2})\/(\d{4})(?:\s+(\d{2}:\d{2}))?/);
 const date=dm?`${dm[3]}-${dm[2]}-${dm[1]} ${dm[4]||'12:00'}`:stamp();
 const bal=(s.match(/(?:new balance|balance|\bbal)\s*(?:is|:)?\s*UGX\s?([\d,]+)/i)||[])[1];
 const ref=(s.match(/(?:transaction id|txn id|\btid|reference)\s*(?:no\.?|:)?\s*([A-Z0-9]{6,})/i)||[])[1];
 const reason=(s.match(/reason:\s*([^.]+)/i)||[])[1];
 const fee=(s.match(/fee(?: was| of)?\s*:?\s*UGX\s?([\d,]+)/i)||[])[1];
 const provider=/airtel/i.test(s)?'airtel':/stanbic|bank|a\/c/i.test(s)?'bank':'mtn';
 const isLoan=kind==='out'&&/\b(loan|pay (?:you|me) back|borrow)/i.test(s);
 const c=kind==='in'?'income':isLoan?'lend':guessCat(`${party||''} ${reason||''}`);
 return{amt,kind:isLoan?'lend':kind,type,party:titleCase(party)||'Unknown',date,bal,ref,reason,fee,provider,cat:c,isLoan};
}
function parseNote(s){
 let amt=0;
 for(const x of s.matchAll(/(\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)\s*(k|m)?(?![a-z])/gi)){let v=parseFloat(x[1].replace(/,/g,''));if(/k/i.test(x[2]||''))v*=1e3;if(/m/i.test(x[2]||''))v*=1e6;if(v>amt)amt=v}
 const title=s.replace(/,?\s*(?:ugx\s*)?(\d{1,3}(?:,\d{3})+|\d+(?:\.\d+)?)\s*(k|m)?(?![a-z])\s*(\/=|\/-|shs|ugx)?/ig,'').replace(/\s+/g,' ').trim();
 return{amt:Math.round(amt),cat:guessCat(s),title:cap(title)||'Cash expense'};
}

function spark(vals,w,h,color,fill){

}
function donut(segs,size,thick,center){
 const r=(size-thick)/2,C=2*Math.PI*r,tot=segs.reduce((a,s)=>a+s.v,0)||1;let acc=0;
 const arcs=segs.map(s=>{const len=s.v/tot*C;const el=`<circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${thick}" stroke-dasharray="${Math.max(0,len-2.5)} ${C}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${size/2} ${size/2})"/>`;acc+=len;return el}).join('');

}

SCREENS.home=()=>{

 <div class="quick">

 </div>

 <button class="card stack" data-go="budgets" style="text-align:left;gap:10px">

  <span class="xs muted">The line marks where you'd be at an even pace. Rent and school fees went out early this cycle.</span>
 </button>

 <div class="insight">${ic('sparkle')}<div class="grow"><b style="font-size:14px">Food is running ahead</b><p class="small" style="margin-top:2px">You've used ${Math.round(fp*100)}% of your food budget with ${DAYS_LEFT} days to go. Market and canteen spending is about 15% above last cycle.</p><button class="link small" style="margin-top:6px" data-act="askAdvisor" data-arg="Am I on track this month?">Ask the advisor →</button></div></div>

 <div class="sec-head"><h2>Coming up</h2><button class="link" data-go="bills">All bills</button></div>
 <div class="list">${bills.map(billRow).join('')}</div>

SCREENS.activity=()=>{const f=S.ui;const cnt=S.txns.filter(t=>t.src==='sms'&&inCycle(t)).length;
 return `
 <div class="search">${ic('search',18)}<input id="q" type="search" placeholder="Search transactions" value="${esc(f.q)}" data-live="q" aria-label="Search transactions"></div>
 <div class="seg" role="tablist">${[['all','All'],['out','Money out'],['in','Money in']].map(([k,l])=>`<button class="${f.tx===k?'on':''}" data-act="txf" data-arg="${k}">${l}</button>`).join('')}</div>
 <div class="chips"><button class="chipbtn ${f.acct==='all'?'on':''}" data-act="acf" data-arg="all">All accounts</button>${S.accounts.map(a=>`<button class="chipbtn ${f.acct===a.id?'on':''}" data-act="acf" data-arg="${a.id}"><span class="acct-dot" style="background:${a.c}"></span>${a.name}</button>`).join('')}</div>

function txListHTML(){const f=S.ui;let l=S.txns.slice().sort((a,b)=>pd(b.d)-pd(a.d));
 if(f.tx==='out')l=l.filter(t=>t.kind!=='in');if(f.tx==='in')l=l.filter(t=>t.kind==='in');
 if(f.acct!=='all')l=l.filter(t=>t.acct===f.acct);
 if(f.q){const q=f.q.toLowerCase();l=l.filter(t=>(t.title+' '+catOf(t).name+' '+acct(t.acct).name).toLowerCase().includes(q))}
 if(!l.length)return `<div class="card muted small" style="text-align:center">No transactions match. Try another word or clear the filters.</div>`;
 const g={};l.forEach(t=>{(g[t.d.slice(0,10)]=g[t.d.slice(0,10)]||[]).push(t)});
 return Object.entries(g).map(([d,ts])=>{const out=ts.filter(t=>t.kind!=='in').reduce((a,t)=>a+t.amt,0);return `<div class="day-head"><span>${dlabel(d)}</span><span class="tnum">${out?'−'+num(out):''}</span></div><div class="list">${ts.map(txRow).join('')}</div>`}).join('')}

SCREENS.budgets=()=>{const sp=cycleSpent(),b=totalBudget(),p=sp/b,pace=DAY_OF_CYCLE/CYCLE_DAYS;
 const over=S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget),warn=S.cats.filter(c=>c.budget&&catSpent(c.id)/c.budget>=S.settings.threshold/100&&catSpent(c.id)<=c.budget);
 return `
 <div class="card row" style="gap:16px">${ring(p,120,12,p>1?'var(--bad)':'var(--accent)',Math.round(p*100)+'%','of budget')}<div class="grow stack" style="gap:6px"><span class="eyebrow">${cycleLabel()}</span><span class="tnum" style="font-family:var(--f-display);font-weight:800;font-size:22px">${num(sp)}</span><span class="small muted tnum">of ${ugx(b)} · ${DAYS_LEFT} days left</span><span class="xs muted">Even pace today would be ${Math.round(pace*100)}%.</span></div></div>
 ${over.length?`<div class="note bad">${ic('alert')}<span><b>${over.map(c=>c.name).join(', ')}</b> ${over.length>1?'are':'is'} over budget.</span></div>`:''}
 ${warn.length?`<div class="note warn">${ic('bell')}<span>${warn.map(c=>`<b>${c.name}</b>`).join(', ')} passed your ${S.settings.threshold}% alert.</span></div>`:''}
 <div class="sec-head"><h2>Categories</h2><button class="link" data-act="addCat">New category</button></div>
 <div class="list">${S.cats.map(budgetLine).join('')}</div>
 <p class="xs muted" style="padding:0 4px">Alerts fire at ${S.settings.threshold}% and 100% of each limit. Change the threshold in Settings.</p>`};

function billRow(b){const d=daysUntil(b.due);let pill;
 if(b.status==='paid')pill=`<span class="pill good">${ic('check',12)} Paid ${b.paidOn?shortDate(b.paidOn).slice(0,-5):''}</span>`;
 else if(d<0)pill=`<span class="pill bad">${-d} day${d===-1?'':'s'} late</span>`;
 else if(d<=3)pill=`<span class="pill warn">${d===0?'Due today':`In ${d} day${d===1?'':'s'}`}</span>`;
 else pill=`<span class="pill">${dlabel(b.due)}</span>`;
 return `<button class="bill" data-act="bill" data-arg="${b.id}"><span class="chip" style="--c:${b.status==='paid'?'var(--good)':d<0?'var(--bad)':'var(--accent)'}">${ic(b.ic)}</span><span class="tx-main"><span class="tx-title">${esc(b.name)}</span><span class="tx-sub tnum">~${ugx(b.amt)}${b.auto?' · matched from SMS':''}</span></span>${pill}</button>`}
SCREENS.bills=()=>{
 const due=S.bills.filter(b=>b.status!=='paid').sort((a,b)=>a.due.localeCompare(b.due)),paid=S.bills.filter(b=>b.status==='paid');
 const late=due.filter(b=>daysUntil(b.due)<0),soon=due.filter(b=>daysUntil(b.due)>=0);
 const total=soon.filter(b=>b.due<='2026-10-24').reduce((a,b)=>a+b.amt,0);
 const first=new Date(2026,9,1),lead=(first.getDay()+6)%7;
 let cal=['M','T','W','T','F','S','S'].map(d=>`<span class="dow">${d}</span>`).join('');
 for(let i=0;i<lead;i++)cal+='<span></span>';
 for(let d=1;d<=31;d++){const ds=`2026-10-${String(d).padStart(2,'0')}`;const bs=S.bills.filter(b=>b.due===ds);const cls=['d',d===2?'today':'',bs.length?'has':'',bs.some(b=>b.status==='paid')?'paid':'',d<2?'muted':''].join(' ');cal+=`<span class="${cls}" title="${bs.map(b=>b.name).join(', ')}">${d}</span>`}
 return `
 <div class="stat3"><div class="stat"><span>Due by 24 Oct</span><b>${kf(total)}</b></div><div class="stat"><span>Late</span><b style="color:${late.length?'var(--bad)':'inherit'}">${late.length}</b></div><div class="stat"><span>Paid</span><b>${paid.length}</b></div></div>
 <div class="card"><div class="between" style="margin-bottom:10px"><b>October 2026</b><span class="xs muted">Dots mark due dates</span></div><div class="cal">${cal}</div></div>
 ${late.length?`<div class="sec-head"><h2>Late</h2></div><div class="list">${late.map(billRow).join('')}</div>`:''}
 <div class="sec-head"><h2>Upcoming</h2><button class="link" data-act="addBill">Add bill</button></div>
 <div class="list">${soon.map(billRow).join('')}</div>
 <div class="sec-head"><h2>Paid this cycle</h2></div>
 <div class="list">${paid.map(billRow).join('')}</div>
 <div class="note">${ic('bell')}<span>Reminders arrive 3 days and 1 day before each due date by push${S.settings.wa?' and WhatsApp':''}. A bill marks itself paid when Kasente sees the matching payment SMS.</span></div>`};

SCREENS.lending=()=>{const tab=S.ui.lendTab;
 const list=S.loans.filter(l=>tab==='open'?l.paid<l.amt:l.paid>=l.amt).sort((a,b)=>a.due.localeCompare(b.due));
 return `
 <div class="stat3"><div class="stat"><span>Owed to you</span><b style="color:var(--good)">${kf(owedToMe())}</b></div><div class="stat"><span>You owe</span><b style="color:var(--bad)">${kf(iOwe())}</b></div><div class="stat"><span>Net</span><b>${kf(owedToMe()-iOwe())}</b></div></div>

function addTxn(t){t.id=nid('t');t.d=t.d||stamp();S.txns.push(t);const a=acct(t.acct);if(a)a.bal+=t.kind==='in'?t.amt:-t.amt;
 if(t.kind==='lend'&&t.loanWho)S.loans.unshift({id:nid('l'),dir:'out',who:t.loanWho,amt:t.amt,paid:0,date:t.d.slice(0,10),due:ymd(new Date(TODAY0.getTime()+30*DAY)),note:'Detected from SMS',auto:true});
 let msg=`Saved ${ugx(t.amt)} · ${catOf(t).name}`;
 if(t.kind==='out'){const c=cat(t.cat);if(c&&c.budget){const p=catSpent(c.id)/c.budget;if(p>=1)msg+=` — ${c.name} is now over budget`;else if(p>=S.settings.threshold/100)msg+=` — ${c.name} at ${Math.round(p*100)}% of budget`}}
 if(t.route){const v=fareVerdict(route(t.route),t.mode,t.amt);if(v&&v.k!=='good')msg=`You paid ${ugx(t.amt)} for ${routeName(route(t.route))}. The usual range is ${num(v.lo)}–${num(v.hi)}.`}
 const b=t.kind==='out'&&S.bills.find(b=>b.status!=='paid'&&guessCat(b.name)===t.cat&&t.cat==='utilities'&&Math.abs(b.amt-t.amt)/b.amt<.15);
 if(b){b.status='paid';b.paidOn=t.d.slice(0,10);b.auto=true;msg+=` · ${b.name} marked paid`}
 toast(msg,t.route&&msg.startsWith('You paid')?'alert':'check');return t}

/* ---------- advisor ---------- */
function advise(q){const s=q.toLowerCase();let m;
 const spent=cycleSpent(),bud=totalBudget();
 if(m=s.match(/save\s+(?:ugx\s*)?([\d.,]+)\s*(k|m|million|mn)?\b.*?\bby\s+([a-z]+)/)){let amt=parseFloat(m[1].replace(/,/g,''));if(/k/.test(m[2]||''))amt*=1e3;else if(/m/.test(m[2]||''))amt*=1e6;else if(amt<1000)amt*=1e6;
  const mi=MONTH_FULL.findIndex(x=>x.toLowerCase().startsWith(m[3].slice(0,3)));if(mi<0)return `Tell me the month you're aiming for, for example "save 2 million by June".`;
  let y=TODAY.getFullYear();if(mi<=TODAY.getMonth())y++;const end=new Date(y,mi+1,0);const months=Math.max(1,(end-TODAY0)/(30.44*DAY));const per=Math.ceil(amt/months/5000)*5000;const free=cycleIncome()-spent;
  return `To reach <b>${ugx(amt)}</b> by the end of ${MONTH_FULL[mi]} ${y} you need about <b>${ugx(per)} a month</b> for ${months.toFixed(1)} months.<ul><li>Last cycle you had about ${ugx(HIST.inc[11]-HIST.exp[11])} left over, so this needs ${per>HIST.inc[11]-HIST.exp[11]?'some cuts as well':'steady discipline, not big cuts'}.</li><li>Food and airtime are your easiest places to trim: both are running above budget.</li><li>A money market fund keeps it separate and earns a little while you wait.</li></ul>Want me to set this up as a goal? <button class="link small" data-act="addGoalPrefill" data-arg="${amt}|${y}-${String(mi+1).padStart(2,'0')}-${end.getDate()}">Create goal</button>`}
 if(/on track|on budget|how am i doing|this month/.test(s)){const fp=catSpent('food')/cat('food').budget;
  return `You've spent <b>${ugx(spent)}</b> of your <b>${ugx(bud)}</b> budget with <b>${DAYS_LEFT} days</b> to go.<ul><li>Rent, school fees and family support are already paid, so most of the big items are behind you.</li><li><b>Food</b> is at ${Math.round(fp*100)}% of its limit, about 15% above last cycle. At this rate it runs out around 9 October.</li><li><b>Airtime & Data</b> is over by ${ugx(catSpent('airtime')-cat('airtime').budget)}.</li></ul>Keeping food to about ${ugx(Math.round((cat('food').budget-catSpent('food'))/DAYS_LEFT/500)*500)} a day keeps you inside the budget.`}
 if(/boda|transport|taxi|fare/.test(s)){const tr=expenses().filter(t=>t.cat==='transport'),tot=tr.reduce((a,t)=>a+t.amt,0),wk=tot/(DAY_OF_CYCLE/7);
  return `You're spending about <b>${ugx(Math.round(wk/500)*500)} a week</b> on transport (${ugx(tot)} this cycle).<ul><li>Your usual boda from City Centre to Ntinda is UGX 4,000, inside the normal range of 3,000–4,000.</li><li>On Wednesday 30 Sep you paid UGX 8,000 for the same trip. Agreeing the price before you board would have saved 4,000.</li><li>The Uber from Acacia Mall (18,000) is your single biggest ride. A taxi plus a short boda costs about half.</li></ul>`}
 if(/run out|ran out|where.*money|why/.test(s))return `Last cycle you earned ${ugx(HIST.inc[11])} and spent ${ugx(HIST.exp[11])}, leaving only ${ugx(HIST.inc[11]-HIST.exp[11])}. Three things drove it:<ul><li><b>Food</b> grew for three cycles in a row, mostly small daily market and canteen buys.</li><li><b>Unplanned family support</b> of UGX 100,000 arrived mid-month on top of the planned amount.</li><li><b>Airtime & data</b> went over budget twice.</li></ul>Most of the gap is everyday spending, not one big purchase. A daily food limit would close about half of it.`;
 if(/school fees|january|term 1/.test(s)){const g=S.goals[0],need=goalNeed(g);
  return `For Term 1 you need <b>${ugx(g.target)}</b> by 31 January. You have <b>${ugx(g.saved)}</b> saved.<ul><li>That leaves ${ugx(g.target-g.saved)} over about ${monthsTo(g.date).toFixed(1)} months, or <b>${ugx(Math.round(need/1000)*1000)} a month</b>.</li><li>You're putting in ${ugx(g.rate)} a month, so you'd arrive about ${ugx(Math.round((g.target-g.saved-g.rate*monthsTo(g.date))/1000)*1000)} short.</li><li>December is your most expensive month every year. Moving 65,000 a month into this goal now protects it from Christmas.</li></ul>`}
 if(/umeme|electric|yaka|power/.test(s))return `Your UMEME top-ups went from ${ugx(UMEME_HIST[0])} to ${ugx(UMEME_HIST[1])} to ${ugx(UMEME_HIST[2])}, up 16% in three months.<ul><li>If tariffs didn't change, the rise is most likely usage: a new appliance, an iron or water heater used more, or more people at home.</li><li>Note your Yaka meter reading each Sunday for two weeks to see which days use the most.</li><li>If the units per top-up dropped while the amount stayed the same, ask UMEME to check the meter.</li></ul>`;
 if(/t-?bill|treasury|bond|fixed deposit/.test(s))return `Both are low-risk. The differences:<ul><li><b>Treasury bills</b> are sold by Bank of Uganda for 91, 182 or 364 days. You buy below face value and get the full amount at maturity. Rates are set at each auction.</li><li><b>Fixed deposits</b> are with one bank at an agreed rate. Easy to open, but breaking early usually costs interest.</li><li>Compare the latest T-bill auction rate with what your bank offers for the same term, after withholding tax on both.</li></ul>For money you won't touch until March, a 182-day bill fits your current 364-day bill well. This is general information, not regulated financial advice.`;
 if(/sacco/.test(s))return `A SACCO is a savings and credit co-operative owned by its members.<ul><li>You buy shares and save regularly. Members can borrow, usually at better rates than a microfinance lender.</li><li>Many pay a yearly dividend. Your Teachers' SACCO paid UGX 72,000 on your 60 shares last March.</li><li>Before joining one, check it's registered, ask for the latest audited accounts and find out how quickly members can withdraw.</li></ul>You're already a member, so the question is whether to raise your monthly 200,000. Given your Term 1 goal, I'd keep it level for now.`;
 if(/lend|owe|borrow|loan|james|brenda/.test(s))return `People owe you <b>${ugx(owedToMe())}</b> and you owe <b>${ugx(iOwe())}</b>.<ul><li>Brenda's repayment date passed on 30 Sep with ${ugx(80000)} left.</li><li>James borrowed ${ugx(50000)} today, due 31 October.</li><li>Aunt Florence is owed ${ugx(200000)} by 15 November.</li></ul>`;
 return `I can help with questions about this cycle's spending, budgets, bills, goals, lending and investment options. Try one of the suggestions below, or ask something like "how much did I spend on food?"`;
}

 if(/ugx/i.test(q)&&/(sent|paid|received|withdr)/i.test(q)){const p=parseSMS(q);if(!p)return 'I couldn\'t read an amount in that message. Forward the full MTN or Airtel confirmation.';
  const t=addTxn({acct:p.provider,kind:p.kind,amt:p.amt,cat:p.cat,title:p.kind==='lend'?`Loan to ${p.party}`:p.kind==='in'?`From ${p.party}`:p.party,src:'whatsapp',sms:q,d:p.date,loanWho:p.isLoan?p.party:null});
  return `Logged ✓ <b>${ugx(p.amt)}</b> · ${catOf(t).name} · ${acct(p.provider).name}${p.isLoan?`<br>Added to your lending ledger: ${esc(p.party)} owes you ${ugx(p.amt)}.`:''}`}
 if(s==='balance')return `<b>Balances</b><br>${S.accounts.map(a=>`${a.name}: ${ugx(a.bal)}`).join('<br>')}<br><b>Total: ${ugx(acctTotal())}</b>`;
 if(/spent today/.test(s)){const ts=S.txns.filter(t=>t.kind==='out'&&pd(t.d)>=TODAY0);return `<b>Spent today: ${ugx(todaySpent())}</b><br>${ts.map(t=>`• ${esc(t.title)} ${num(t.amt)}`).join('<br>')}`}
 if(s==='budget'){const l=totalBudget()-cycleSpent();return `<b>${ugx(l)} left</b> of ${ugx(totalBudget())} with ${DAYS_LEFT} days to go.<br>${S.cats.filter(c=>c.budget&&catSpent(c.id)/c.budget>=.8).map(c=>`⚠ ${c.name}: ${Math.round(catSpent(c.id)/c.budget*100)}%`).join('<br>')}`}
 if(m=s.match(/^remind me\s+(.+?)\s+(\d{1,2})\s*([a-z]{3})/)){const mi=MON.findIndex(x=>x.toLowerCase()===m[3]);if(mi<0)return 'Use a date like "5 Oct".';const due=`${mi<TODAY.getMonth()?TODAY.getFullYear()+1:TODAY.getFullYear()}-${String(mi+1).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;const name=titleCase(m[1]);
  const ex=S.bills.find(b=>b.name.toLowerCase().startsWith(m[1].toLowerCase()));if(ex){ex.due=due;ex.status='due'}else S.bills.push({id:nid('b'),name,kind:'Other',ic:'calendar',amt:0,due,status:'due',note:'Added from WhatsApp'});
  return `Done ✓ I'll remind you about <b>${esc(name)}</b> on ${dlabel(due)}, 3 days and 1 day before.`}
 return `Commands I understand:<br>• <b>balance</b><br>• <b>spent today</b><br>• <b>budget</b><br>• <b>remind me</b> [bill] [date]<br>Or forward any MoMo / Airtel Money SMS or a receipt photo.`}

 <form class="stack" data-form="full" id="pane-form" hidden>

function openGoal(amt,date){openSheet('New savings goal',`<form class="stack" data-form="addGoal"><label class="field"><span>Goal name</span><input name="name" required placeholder="e.g. Land deposit" value="${amt?'Savings goal':''}"></label><div class="grid2"><label class="field"><span>Target (UGX)</span><input name="target" type="number" inputmode="numeric" required value="${amt||''}"></label><label class="field"><span>By</span><input name="date" type="date" required value="${date||'2027-06-30'}"></label></div><label class="field"><span>Save automatically</span><select name="auto"><option>10% of every deposit</option><option>UGX 50,000 every Friday</option><option>On payday</option><option>Manual</option></select></label><button class="btn primary">Create goal</button></form>`)}
function openTx(id){const t=S.txns.find(x=>x.id===id);const c=catOf(t);const p=t.sms?parseSMS(t.sms):null;const v=t.route?fareVerdict(route(t.route),t.mode,t.amt):null;
 openSheet('Transaction',`<div class="stack">
  <div class="row"><span class="chip" style="--c:${c.c};width:52px;height:52px">${ic(c.ic,24)}</span><div class="grow"><div class="tnum" style="font-family:var(--f-display);font-weight:800;font-size:26px;color:${t.kind==='in'?'var(--good)':'var(--ink)'}">${t.kind==='in'?'+':'−'}${ugx(t.amt)}</div><div class="small muted">${esc(t.title)}</div></div></div>
  ${v?`<div class="note ${v.k==='bad'?'bad':v.k==='warn'?'warn':''}">${ic('bike')}<span class="small"><b>${v.label}.</b> ${routeName(route(t.route))} by ${t.mode} usually costs ${ugx(v.lo)}–${num(v.hi)}.</span></div>`:''}
  <dl class="kv"><dt>When</dt><dd>${dlabel(t.d)}, ${hm(t.d)}</dd><dt>Account</dt><dd>${acct(t.acct).name}</dd><dt>Captured from</dt><dd>${srcTag(t.src)}</dd>${p&&p.ref?`<dt>Reference</dt><dd>${p.ref}</dd>`:''}${p&&p.bal?`<dt>Balance after</dt><dd>UGX ${p.bal}</dd>`:''}</dl>
  ${t.kind==='out'?`<label class="field"><span>Category</span><select data-live="txcat" data-id="${t.id}">${catOptions(t.cat)}</select></label>`:''}
  ${t.sms?`<div class="field"><span>Original message</span><div class="mono">${esc(t.sms)}</div></div>`:''}
  <button class="btn danger" data-act="txDel" data-arg="${t.id}">Delete transaction</button></div>`)}
function openReport(k){const segs=S.cats.filter(c=>c.budget||catSpent(c.id));const T={monthly:'Monthly summary · '+cycleLabel(),annual:'Annual overview · '+TODAY.getFullYear(),custom:'Custom range'}[k];
 const body=k==='custom'?(()=>{const a=ymd(PREV_START),b=ymd(TODAY0);const ts=S.txns.filter(t=>t.d.slice(0,10)>=a&&t.d.slice(0,10)<=b);const sp=ts.filter(t=>t.kind==='out').reduce((x,t)=>x+t.amt,0);return `<div class="grid2"><label class="field"><span>From</span><input type="date" value="${a}"></label><label class="field"><span>To</span><input type="date" value="${b}"></label></div><div class="note">${ic('info')}<span class="small">Covers ${Math.round((TODAY0-PREV_START)/DAY)+1} days · ${ts.length} transactions · ${ugx(sp)} spent</span></div>`})()
 :k==='annual'?`<dl class="kv"><dt>Income (12 months)</dt><dd>${ugx(H().inc.reduce((a,b)=>a+b,0))}</dd><dt>Spending</dt><dd>${ugx(H().exp.reduce((a,b)=>a+b,0))}</dd><dt>Saved</dt><dd>${ugx(H().inc.reduce((a,b)=>a+b,0)-H().exp.reduce((a,b)=>a+b,0))}</dd><dt>Investment growth</dt><dd>${ugx(invTotal()-S.inv.reduce((a,x)=>a+x.invested,0))}</dd><dt>Net worth change</dt><dd>${ugx(netWorth()-(H().nw.length?H().nw[0]*1e6:netWorth()))}</dd></dl><div class="note">${ic('sparkle')}<span class="small">${S.mode==='fresh'?'Totals cover the months you have logged in Kasente so far.':'Your best year on record. December and June were the expensive months; both had school fees plus family events.'}</span></div>`
 :`<dl class="kv"><dt>Income</dt><dd>${ugx(cycleIncome())}</dd><dt>Spending</dt><dd>${ugx(cycleSpent())}</dd><dt>Budget</dt><dd>${ugx(totalBudget())}</dd></dl><div class="list" style="margin-top:4px">${segs.map(c=>{const s=catSpent(c.id);return `<div class="setrow" style="padding:8px 12px"><span class="grow"><b style="font-size:13.5px">${c.name}</b></span><span class="small tnum">${num(s)} / ${c.budget?num(c.budget):'—'}</span>${c.budget&&s>c.budget?'<span class="pill bad">Over</span>':''}</div>`}).join('')}</div><div class="note">${ic('sparkle')}<span class="small"><b>Commentary.</b> ${S.mode==='fresh'?(S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget).map(c=>c.name).join(', ')||'Every category')+(S.cats.some(c=>c.budget&&catSpent(c.id)>c.budget)?' went over its limit.':' is within its limit so far.'):'The fixed costs are paid early, which is good. Food and airtime are the two categories to watch for the rest of the cycle.'}</span></div>`;
 openSheet(T,`<div class="stack">${body}<div class="grid2"><button class="btn primary" data-act="exportR" data-arg="PDF">${ic('down',18)}PDF</button><button class="btn" data-act="exportR" data-arg="Excel">${ic('down',18)}Excel</button></div></div>`)}

 q:el=>{S.ui.q=el.value;$('#txlist').innerHTML=txListHTML()},

 threshold:el=>{S.settings.threshold=+el.value;toast(`Budget alerts at ${el.value}%`,'bell')},
 lang:el=>{S.settings.lang=el.value;toast(el.value==='lg'?'Luganda (beta) turned on for the advisor and menus':'English','info')},
 item:el=>{SCAN.items[+el.dataset.i][+el.dataset.k]=el.dataset.k==='1'?+el.value:el.value;$('#scanTotal').textContent=ugx(SCAN.items.reduce((a,x)=>a+(+x[1]||0),0))},

 stmt:el=>{if(el.files[0]){closeSheet();toast(`Imported ${esc(el.files[0].name)}. In the app, new rows appear for you to review.`,'upload')}},

<script>
/* ===== Kasente test build layer: real dates, saved data, Android bridge ===== */
const SAMPLE_SNAPSHOT=JSON.stringify(S);
const STORE='kasente.v1';

const hashPin=p=>{let x=5381;for(const c of 'kasente:'+p)x=((x<<5)+x+c.charCodeAt(0))|0;return 'h'+(x>>>0).toString(36)};
const plusDays=(d,n)=>new Date(d.getTime()+n*DAY);
const hhmm=d=>`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
const cycleLabel=()=>`${CYCLE_START.getDate()} ${MON[CYCLE_START.getMonth()]} – ${CYCLE_END.getDate()} ${MON[CYCLE_END.getMonth()]}`;
const isFresh=()=>S.mode==='fresh';
const initials=n=>(n||'?').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const ordinal=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const sumAmt=a=>a.reduce((x,t)=>x+t.amt,0);
ONB[2].p='Everything is stored on this phone and works offline. Save a backup file from Settings whenever you like. No ads, no data selling.';

/* ---------- history for charts ---------- */
function H(){
 if(!isFresh())return{labels:HIST.labels,inc:HIST.inc,exp:HIST.exp,nw:HIST.nw,nwLabels:HIST.labels,prev:HIST.nw[HIST.nw.length-1]*1e6};
 const labels=[],inc=[],exp=[];
 for(let i=11;i>=0;i--){const d=new Date(TODAY0.getFullYear(),TODAY0.getMonth()-i,1);const k=ymd(d).slice(0,7);labels.push(MON[d.getMonth()]);
  inc.push(sumAmt(S.txns.filter(t=>t.kind==='in'&&t.d.startsWith(k))));exp.push(sumAmt(S.txns.filter(t=>t.kind==='out'&&t.d.startsWith(k))))}
 const today=ymd(TODAY0);const ks=Object.keys(S.nwHist||{}).filter(k=>k<today).sort().slice(-11);
 const prevK=ks.filter(k=>k<=ymd(CYCLE_START)).pop()||ks[0];
 return{labels,inc,exp,nw:ks.map(k=>S.nwHist[k]/1e6),nwLabels:[...ks,today].map(k=>{const d=pd(k+' 00:00');return d.getDate()+' '+MON[d.getMonth()]}),prev:prevK!=null?S.nwHist[prevK]:null};
}

/* ---------- saving ---------- */
function recordDaily(){const k=ymd(TODAY0);S.nwHist=S.nwHist||{};S.nwHist[k]=netWorth();
 if(isFresh())S.accounts.forEach(a=>{a.hist=a.hist||{};a.hist[k]=a.bal;a.trend=Object.keys(a.hist).sort().slice(-8).map(d=>a.hist[d]/1000)})}
function save(){if(!S.mode)return;recordDaily();try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}
function bumpIds(){let mx=NID;const scan=o=>{if(Array.isArray(o))o.forEach(scan);else if(o&&typeof o==='object'){if(typeof o.id==='string'){const n=parseInt(o.id.replace(/\D/g,''),10);if(n>mx)mx=n}Object.values(o).forEach(v=>{if(v&&typeof v==='object')scan(v)})}};scan(S);NID=mx}
function load(){try{const j=localStorage.getItem(STORE);if(!j)return false;const d=JSON.parse(j);if(!d||!d.mode)return false;Object.assign(S,d);S.ui={...S.ui,q:''};bumpIds();return true}catch(e){return false}}
function startFresh(name,pdy){
 Object.assign(S,JSON.parse(SAMPLE_SNAPSHOT));
 Object.assign(S,{mode:'fresh',user:{name,full:name,role:''},txns:[],bills:[],loans:[],goals:[],inv:[],notifs:[],family:null,nwHist:{},readN:[],smsSeen:[],smsSince:0});
 S.accounts=[['mtn','MTN MoMo','Mobile money · auto from SMS','#F5C000'],['airtel','Airtel Money','Mobile money · auto from SMS','#D7262E'],['cash','Cash on hand','Adjusted by you','#2F8A5B']].map(([id,n,t,c])=>({id,name:n,type:t,bal:0,c,trend:[]}));
 S.settings={...S.settings,payday:pdy,lock:false,pin:null,sms:true,wa:false};
 S.ui={tx:'all',acct:'all',q:'',range:6,lendTab:'open',invTab:'all'};
 S.chat=[{me:false,html:`Hi ${esc(name)}. Ask me about your spending, budgets, bills or goals. I work from the figures on this phone, and they don't leave it.`}];
 S.wa=[{me:false,html:'Send <b>balance</b>, <b>spent today</b> or <b>budget</b>, or paste a MoMo message to log it.',time:hhmm(new Date())}];
 tick();
}
function ensureAcct(id){if(acct(id))return;const d={mtn:['MTN MoMo','Mobile money · auto from SMS','#F5C000'],airtel:['Airtel Money','Mobile money · auto from SMS','#D7262E'],bank:['Bank','Bank · from SMS','#2558B0'],cash:['Cash on hand','Adjusted by you','#2F8A5B']}[id]||['Account','','#7C8F8B'];S.accounts.push({id,name:d[0],type:d[1],bal:0,c:d[2],trend:[]})}

/* ---------- bills that repeat ---------- */
function rollBills(){S.bills.forEach(b=>{if(b.status!=='paid'||(b.note||'')==='Once')return;const rep=b.rep||'Monthly';if(rep==='Once')return;
 let guard=0;while(daysUntil(b.due)<0&&guard++<24){const d=pd(b.due+' 00:00');const n=rep==='Yearly'?new Date(d.getFullYear()+1,d.getMonth(),d.getDate()):rep==='Every term'?new Date(d.getFullYear(),d.getMonth()+4,d.getDate()):new Date(d.getFullYear(),d.getMonth()+1,d.getDate());b.due=ymd(n);b.status='due';b.auto=false}})}

/* ---------- notifications worked out from your data ---------- */
function computeNotifs(){const out=[],cs=ymd(CYCLE_START),th=S.settings.threshold/100;
 S.cats.forEach(c=>{if(!c.budget)return;const sp=catSpent(c.id),p=sp/c.budget;
  if(p>1)out.push({id:`over-${c.id}-${cs}`,t:'bad',ic:'alert',title:`${c.name} is over budget`,body:`${ugx(sp)} spent of ${ugx(c.budget)}.`,when:'This cycle',go:'budgets'});
  else if(p>=th)out.push({id:`warn-${c.id}-${cs}`,t:'warn',ic:'alert',title:`${c.name} is at ${Math.round(p*100)}% of budget`,body:`${DAYS_LEFT} days left in this cycle.`,when:'This cycle',go:'budgets'})});
 S.bills.filter(b=>b.status!=='paid').forEach(b=>{const d=daysUntil(b.due);
  if(d<0)out.push({id:`late-${b.id}-${b.due}`,t:'bad',ic:'calendar',title:`${b.name} is ${-d} day${d===-1?'':'s'} late`,body:b.amt?`About ${ugx(b.amt)}.`:'Mark it paid once it is settled.',when:dlabel(b.due),go:'bills'});
  else if(d<=3)out.push({id:`due-${b.id}-${b.due}`,t:'accent',ic:'calendar',title:d===0?`${b.name} is due today`:`${b.name} due in ${d} day${d===1?'':'s'}`,body:b.amt?`About ${ugx(b.amt)}.`:'',when:dlabel(b.due),go:'bills'})});
 S.loans.filter(l=>l.amt>l.paid&&daysUntil(l.due)<0).forEach(l=>out.push({id:`loan-${l.id}-${l.due}`,t:'warn',ic:'hand',title:l.dir==='out'?`${l.who}'s repayment date has passed`:`Your repayment to ${l.who} is late`,body:`${ugx(l.amt-l.paid)} outstanding since ${dlabel(l.due)}.`,when:dlabel(l.due),go:'lending'}));
 const rd=S.readN||[];out.forEach(n=>n.read=rd.includes(n.id));return out}
ACT.notif=a=>{const n=S.notifs.find(x=>x.id===a);if(!n)return;n.read=true;S.readN=[...new Set([...(S.readN||[]),a])].slice(-300);go(n.go)};
ACT.readAll=()=>{S.notifs.forEach(n=>n.read=true);S.readN=[...new Set([...(S.readN||[]),...S.notifs.map(n=>n.id)])].slice(-300);refresh()};

/* ---------- phone reminders (Android alarms) ---------- */
let lastSched='';
function scheduleReminders(){if(!NATIVE||!NATIVE.schedule||!S.mode)return;const now=Date.now(),list=[];
 if(!isFresh()){const j='[]';if(j!==lastSched){lastSched=j;try{NATIVE.schedule(j)}catch(e){}}return}
 const at=(ds,off)=>{const d=pd(ds+' 08:00');return d.getTime()-off*DAY};
 S.bills.filter(b=>b.status!=='paid').forEach(b=>[3,1,0].forEach(o=>{const t=at(b.due,o);if(t>now)list.push({title:o?`${b.name} due in ${o} day${o>1?'s':''}`:`${b.name} is due today`,body:b.amt?`About ${ugx(b.amt)}. Tap to open Kasente.`:'Tap to open Kasente.',at:t})}));
 S.loans.filter(l=>l.amt>l.paid).forEach(l=>{const t=at(l.due,1);if(t>now)list.push({title:l.dir==='out'?`${l.who} is due to repay tomorrow`:`You're due to repay ${l.who} tomorrow`,body:`${ugx(l.amt-l.paid)} outstanding.`,at:t})});
 list.sort((a,b)=>a.at-b.at);const j=JSON.stringify(S.settings.push?list.slice(0,60):[]);if(j===lastSched)return;lastSched=j;try{NATIVE.schedule(j)}catch(e){}}

/* ---------- status bar colour follows the theme ---------- */
let lastBars='';
function applyBars(){if(!NATIVE||!NATIVE.setBars)return;const st=getComputedStyle(document.documentElement);const bg=st.getPropertyValue('--bg').trim();const t=document.documentElement.getAttribute('data-theme');const dark=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;const k=bg+dark;if(k===lastBars)return;lastBars=k;try{NATIVE.setBars(bg,!dark)}catch(e){}}

/* ---------- render wrapper ---------- */
const baseRender=window.render;
window.render=function(keep){tick();rollBills();if(isFresh())S.notifs=computeNotifs();baseRender(keep);save();applyBars();scheduleReminders()};

/* ---------- recording transactions ---------- */
const billWords=b=>(b.kind+' '+b.name).toLowerCase().split(/[^a-z]+/).filter(w=>w.length>3&&!['bill','with','monthly','home','balance','term','subscription','repayment','contribution'].includes(w));
window.addTxn=function(t,quiet){t.id=nid('t');t.d=t.d||stamp();ensureAcct(t.acct);S.txns.push(t);const a=acct(t.acct);if(a)a.bal+=t.kind==='in'?t.amt:-t.amt;if(t.kind==='move'&&t.acct!=='cash'){ensureAcct('cash');acct('cash').bal+=t.amt}
 if(t.kind==='lend'&&t.loanWho)S.loans.unshift({id:nid('l'),dir:'out',who:t.loanWho,amt:t.amt,paid:0,date:t.d.slice(0,10),due:ymd(plusDays(pd(t.d),30)),note:'Detected from the MoMo note',auto:true});
 let paidBill=null;
 if(t.kind==='out'){const txt=(t.title+' '+(t.sms||'')).toLowerCase();paidBill=S.bills.find(b=>b.status!=='paid'&&b.amt&&Math.abs(b.amt-t.amt)/b.amt<.2&&billWords(b).some(w=>txt.includes(w)));if(paidBill){paidBill.status='paid';paidBill.paidOn=t.d.slice(0,10);paidBill.auto=true}}
 if(quiet)return t;
 let msg=`Saved ${ugx(t.amt)} · ${catOf(t).name}`,icn='check';
 if(t.kind==='out'){const c=cat(t.cat);if(c&&c.budget){const p=catSpent(c.id)/c.budget;if(p>1)msg+=`. ${c.name} is now over budget`;else if(p>=S.settings.threshold/100)msg+=`. ${c.name} is at ${Math.round(p*100)}% of budget`}}
 if(t.route){const v=fareVerdict(route(t.route),t.mode,t.amt);if(v&&v.k!=='good'){msg=`You paid ${ugx(t.amt)} for ${routeName(route(t.route))}. The usual range is ${num(v.lo)}–${num(v.hi)}.`;icn='alert'}}
 if(paidBill)msg+=`. ${paidBill.name} marked paid`;
 toast(msg,icn);return t};

/* ---------- reading real MoMo messages ---------- */
const MONEY_RE=/(?:UGX|Ugx|Ushs?|Shs?)\.?\s?[\d,]{2,}|[\d,]{3,}(?:\.\d+)?\s?(?:UGX|Ushs?)/i;
const SKIP_RE=/\b(otp|one[- ]time|verification|code is|password|failed|unsuccessful|insufficient|declined|not successful|reversal|win\b|winner|offer|promo|bonus|dial \*|qualif|congratulations|loan limit|eligible|click|http)/i;
const ACTION_RE=/\b(sent|received|paid|payment|withdr\w*|deposit\w*|debited|credited|transferred|transfer|cash ?out|cash ?in|bought|purchase)\b/i;
const isMoneySms=b=>!!b&&MONEY_RE.test(b)&&ACTION_RE.test(b)&&!SKIP_RE.test(b);
window.parseSMS=function(raw,sender){
 const s=String(raw||'').replace(/\s+/g,' ').trim(),from=String(sender||'');
 const am=s.match(/(?:UGX|Ugx|Ushs?|Shs?)\.?\s?([\d,]+(?:\.\d+)?)/i)||s.match(/([\d,]{3,})(?:\.\d+)?\s?(?:UGX|Ushs?)/i);
 if(!am)return null;const amt=Math.round(+am[1].replace(/,/g,''));if(!amt)return null;
 let kind='out',type=null;
 if(/withdr\w*|cash ?out/i.test(s)){kind='move';type='Withdrawn to cash'}
 else if(/\breceived\b|\bcredited\b|cash ?in\b|deposit(?:ed)? .{0,20}(?:to|into) your/i.test(s)){kind='in';type=/deposit/i.test(s)?'Deposit':'Received'}
 else if(/\bdebited\b/i.test(s))type='Bank debit';
 else if(/\bpaid\b|\bpayment\b|\bbought\b|\bpurchase/i.test(s))type='Paid to merchant';
 else if(/\bsent\b|transferred|transfer of/i.test(s))type='Sent';
 let party=(s.match(/\b(?:to|from)\s+([A-Za-z][A-Za-z0-9&.' -]{1,40}?)(?=\s*(?:\(|,|\.|;|:|\s(?:\+?256|0)\d{6,}|\s\d{6,}|\son\b|\sat\b|\sref|\stid|\swith\b|\sfor\b|$))/i)||[])[1];
 if(!party&&kind==='move')party=(s.match(/\bat (?:agent\s+)?([A-Za-z][A-Za-z0-9&.' -]{2,30}?)(?=\s+on\b|[.,]|$)/i)||[])[1];
 if(!party)party=(s.match(/\bto\s+(?:\+?256|0)\d{6,}\s+([A-Za-z][A-Za-z' -]{1,30}?)(?=[.,]|\s(?:charge|fee|bal|on)\b|$)/i)||[])[1];
 if(party&&/^(your|you|account|a\/c|mobile|the|wallet|number)\b/i.test(party))party=null;
 const dm=s.match(/(\d{2})[\/-](\d{2})[\/-](\d{4})(?:\s+(\d{2}:\d{2}))?/);
 const date=dm?`${dm[3]}-${dm[2]}-${dm[1]} ${dm[4]||'12:00'}`:stamp();
 const bal=(s.match(/(?:new balance|available balance|avl\.? bal|balance|\bbal)\s*(?:is|:)?\s*(?:UGX|Ugx|Ushs?|Shs?)\.?\s?([\d,]+)/i)||[])[1];
 const ref=(s.match(/(?:transaction id|txn id|trans(?:action)? ?ref|\btid|reference|\bref)\s*(?:no\.?|:|#)?\s*([A-Z0-9.]{6,})/i)||[])[1];
 const reason=(s.match(/(?:reason|message|note)\s*:\s*([^.]+)/i)||[])[1];
 const fee=(s.match(/(?:fee|charge)s?(?: was| of)?\s*:?\s*(?:UGX|Ugx|Shs?)\.?\s?([\d,]+)/i)||[])[1];
 const provider=/airtel/i.test(from+' '+s)?'airtel':/(mtn|momo|m-money)/i.test(from)?'mtn':/(stanbic|centenary|dfcu|absa|equity|housing|bank|a\/c|acct)/i.test(from+' '+s)?'bank':'mtn';
 const isLoan=kind==='out'&&/\b(loan|pay (?:you|me) back|borrow)/i.test(reason||'');
 const c=kind==='in'?'income':kind==='move'?'move':isLoan?'lend':guessCat(`${party||''} ${reason||''} ${s}`);
 return{amt,kind:isLoan?'lend':kind,type:type||'Money out',party:titleCase(party)||'Unknown',date,bal,ref,reason,fee,provider,cat:c,isLoan,uncertain:!type||(!party&&kind!=='move'&&type!=='Bank debit')};
};
function smsSync(manual){
 if(!NATIVE||!isFresh())return;
 if(!S.settings.sms){if(manual)toast('Turn on "Read money SMS" in Settings first.','sms');return}
 let ok=false;try{ok=NATIVE.hasSmsPermission()}catch(e){}
 if(!ok){if(manual)try{NATIVE.requestSmsPermission()}catch(e){}return}
 const since=S.smsSince||(Date.now()-60*DAY);let list=[];try{list=JSON.parse(NATIVE.readSms(String(since))||'[]')}catch(e){list=[]}
 S.smsSeen=S.smsSeen||[];let added=0,review=0,maxDate=since;
 list.sort((a,b)=>a.date-b.date).forEach(m=>{const key=m.date+'|'+String(m.body||'').slice(0,48);if(m.date>maxDate)maxDate=m.date;if(S.smsSeen.includes(key))return;S.smsSeen.push(key);
  if(!isMoneySms(m.body))return;const p=parseSMS(m.body,m.address);if(!p)return;const d=new Date(+m.date);ensureAcct(p.provider);
  addTxn({acct:p.provider,kind:p.kind,amt:p.amt,cat:p.cat,title:p.kind==='lend'?`Loan to ${p.party}`:p.kind==='move'?`Cash withdrawal${p.party!=='Unknown'?' · '+p.party:''}`:p.kind==='in'?(p.party==='Unknown'?p.type:`From ${p.party}`):(p.party==='Unknown'?p.type:p.party),src:'sms',sms:m.body,d:`${ymd(d)} ${hhmm(d)}`,loanWho:p.isLoan?p.party:null,review:p.uncertain},true);
  if(p.bal){const a=acct(p.provider);if(a)a.bal=+p.bal.replace(/,/g,'')}
  added++;if(p.uncertain)review++});
 S.smsSeen=S.smsSeen.slice(-1500);S.smsSince=maxDate;S.smsLast=Date.now();
 if(added){refresh();toast(`${added} transaction${added>1?'s':''} read from your messages${review?`. ${review} to check`:''}`,'sms')}else{save();if(manual)toast('No new money messages found.','sms')}
}

/* ---------- advisor working from your own figures ---------- */
const baseAdvise=window.advise;
window.advise=function(q){if(!isFresh())return baseAdvise(q);
 const s=q.toLowerCase();let m;const spent=cycleSpent(),bud=totalBudget(),pace=DAY_OF_CYCLE/CYCLE_DAYS,cur=expenses();
 const prevTx=S.txns.filter(t=>{const d=pd(t.d);return d>=PREV_START&&d<CYCLE_START});
 const prevIn=sumAmt(prevTx.filter(t=>t.kind==='in')),prevOut=sumAmt(prevTx.filter(t=>t.kind==='out'));
 const none="I don't have enough to go on yet. Log a few days of spending, or let Kasente read your MoMo messages, then ask again.";
 const byCat=list=>{const g={};list.forEach(t=>g[t.cat]=(g[t.cat]||0)+t.amt);return Object.entries(g).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({c:cat(id)||cat('other'),v}))};
 if(m=s.match(/save\s+(?:ugx\s*)?([\d.,]+)\s*(k|m|million|mn)?\b.*?\bby\s+([a-z]+)/)){let amt=parseFloat(m[1].replace(/,/g,''));if(/k/.test(m[2]||''))amt*=1e3;else if(/m/.test(m[2]||''))amt*=1e6;else if(amt<1000)amt*=1e6;
  const mi=MONTH_FULL.findIndex(x=>x.toLowerCase().startsWith(m[3].slice(0,3)));if(mi<0)return 'Tell me the month you are aiming for, for example "save 2 million by June".';
  let y=TODAY.getFullYear();if(mi<=TODAY.getMonth())y++;const end=new Date(y,mi+1,0);const months=Math.max(1,(end-TODAY0)/(30.44*DAY));const per=Math.ceil(amt/months/5000)*5000;
  return `To reach <b>${ugx(amt)}</b> by the end of ${MONTH_FULL[mi]} ${y} you need about <b>${ugx(per)} a month</b> for ${months.toFixed(1)} months.<ul>${prevTx.length?`<li>Last cycle you kept ${ugx(prevIn-prevOut)} after spending, so this ${per>prevIn-prevOut?'needs some cuts as well':'fits if you keep last cycle\'s habits'}.</li>`:'<li>Once you have a full cycle logged I can tell you whether this fits your usual leftover.</li>'}<li>Moving the money on payday, before spending starts, works better than saving what is left.</li></ul><button class="link small" data-act="addGoalPrefill" data-arg="${amt}|${ymd(end)}">Create this goal</button>`}
 if(/on track|on budget|how am i doing|this month/.test(s)){if(!cur.length)return none;
  const over=S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget),ahead=S.cats.filter(c=>c.budget&&catSpent(c.id)<=c.budget&&catSpent(c.id)/c.budget>pace+.15).sort((a,b)=>catSpent(b.id)/b.budget-catSpent(a.id)/a.budget);
  const daily=Math.max(0,(bud-spent)/Math.max(1,DAYS_LEFT+1));
  return `You've spent <b>${ugx(spent)}</b> of <b>${ugx(bud)}</b> with <b>${DAYS_LEFT} days</b> left. That's ${Math.round(spent/bud*100)}% used with ${Math.round(pace*100)}% of the cycle gone.<ul>${over.map(c=>`<li><b>${c.name}</b> is over by ${ugx(catSpent(c.id)-c.budget)}.</li>`).join('')}${ahead.slice(0,2).map(c=>`<li><b>${c.name}</b> is at ${Math.round(catSpent(c.id)/c.budget*100)}% of its limit. About ${ugx(Math.round((c.budget-catSpent(c.id))/Math.max(1,DAYS_LEFT+1)/500)*500)} a day keeps it inside.</li>`).join('')}${!over.length&&!ahead.length?'<li>No category is running ahead of pace.</li>':''}</ul>Across everything, about <b>${ugx(Math.round(daily/500)*500)} a day</b> keeps you inside your total budget.`}
 if(/boda|transport|taxi|fare/.test(s)){const tr=cur.filter(t=>t.cat==='transport');if(!tr.length)return 'No transport logged this cycle yet. Log boda and taxi fares, or pay riders by MoMo, and I can compare them with normal prices.';
  const tot=sumAmt(tr),wk=tot/Math.max(1,DAY_OF_CYCLE/7);const over=tr.filter(t=>{const v=t.route&&fareVerdict(route(t.route),t.mode,t.amt);return v&&t.amt>v.hi});const big=tr.slice().sort((a,b)=>b.amt-a.amt)[0];
  return `You're spending about <b>${ugx(Math.round(wk/500)*500)} a week</b> on transport (${ugx(tot)} this cycle, ${tr.length} trips).<ul>${over.length?`<li>${over.length} ride${over.length>1?'s were':' was'} above the usual fare, ${ugx(over.reduce((a,t)=>a+t.amt-fareVerdict(route(t.route),t.mode,t.amt).hi,0))} more than the top of the range in total.</li>`:'<li>None of the rides with a route set were above the usual fare.</li>'}<li>Your biggest trip was ${esc(big.title)} at ${ugx(big.amt)}.</li><li>Pick a route when you log a ride and I will check every fare.</li></ul>`}
 if(/run out|ran out|where.*money|why/.test(s)){const base=prevTx.filter(t=>t.kind==='out').length>4?prevTx.filter(t=>t.kind==='out'):cur;if(!base.length)return none;const top=byCat(base).slice(0,3);const label=base===cur?'this cycle':'last cycle';
  return `Here is where the money went ${label} (${ugx(sumAmt(base))} in total):<ul>${top.map(x=>`<li><b>${x.c.name}</b>: ${ugx(x.v)} (${Math.round(x.v/sumAmt(base)*100)}%)</li>`).join('')}</ul>${S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget).length?`Over budget now: ${S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget).map(c=>c.name).join(', ')}.`:'Small daily spending adds up fastest. A daily limit for the top category usually closes most of the gap.'}`}
 if(/school fees|january|term/.test(s)){const g=S.goals.find(x=>/school|fee|term|tuition/i.test(x.name));if(!g)return `You don't have a school fees goal yet. Create one with the amount and the date it's due, and I'll tell you how much to put aside each month. <button class="link small" data-act="addGoal">New goal</button>`;const need=goalNeed(g);
  return `For <b>${esc(g.name)}</b> you need ${ugx(g.target)} by ${shortDate(g.date)}. You have ${ugx(g.saved)}.<ul><li>That is about <b>${ugx(Math.round(need/1000)*1000)} a month</b> from now.</li>${g.rate?`<li>You're putting in ${ugx(g.rate)} a month, so you're ${g.rate>=need?'on track':'about '+ugx(Math.round((need-g.rate)/1000)*1000)+' a month short'}.</li>`:''}</ul>`}
 if(/umeme|electric|yaka|power/.test(s)){const l=S.txns.filter(t=>t.kind==='out'&&/umeme|yaka|electric/i.test(t.title+' '+(t.sms||''))).sort((a,b)=>pd(a.d)-pd(b.d)).slice(-3);
  const tips='<ul><li>Note your Yaka meter reading every Sunday for two weeks to see which days use the most.</li><li>Irons, water heaters and old fridges are the usual causes of a rise.</li><li>If the units you get per top-up fall while the amount is the same, ask UMEME to check the meter.</li></ul>';
  if(l.length<2)return 'I need at least two UMEME payments to compare. Meanwhile:'+tips;const ch=(l[l.length-1].amt-l[0].amt)/l[0].amt;
  return `Your last UMEME payments were ${l.map(t=>ugx(t.amt)).join(', ')}, ${ch>=0?'up':'down'} ${Math.abs(Math.round(ch*100))}%.`+tips}
 if(/t-?bill|treasury|bond|fixed deposit/.test(s))return 'Both are low-risk. The differences:<ul><li><b>Treasury bills</b> are sold by Bank of Uganda for 91, 182 or 364 days. You pay less than the face value and receive the full amount at maturity. Rates are set at each auction.</li><li><b>Fixed deposits</b> are with one bank at an agreed rate. Easy to open, but breaking early usually costs interest.</li><li>Compare the latest T-bill auction rate with your bank\'s offer for the same term, after withholding tax on both.</li></ul>This is general information, not regulated financial advice.';
 if(/sacco/.test(s))return 'A SACCO is a savings and credit co-operative owned by its members.<ul><li>You buy shares and save regularly. Members can borrow, usually at better rates than a microfinance lender.</li><li>Many pay a yearly dividend on shares.</li><li>Before joining, check it is registered, ask for the latest audited accounts and find out how quickly members can withdraw.</li></ul>';
 if(/lend|owe|borrow|loan/.test(s)){const open=S.loans.filter(l=>l.amt>l.paid);if(!open.length)return 'No open loans recorded. Send money with the note "loan" or record it under Lending, and I will keep track.';
  return `People owe you <b>${ugx(owedToMe())}</b> and you owe <b>${ugx(iOwe())}</b>.<ul>${open.map(l=>`<li>${esc(l.who)}: ${ugx(l.amt-l.paid)} ${l.dir==='out'?'owed to you':'you owe'}, due ${dlabel(l.due)}${daysUntil(l.due)<0?' (late)':''}.</li>`).join('')}</ul>`}
 const c=S.cats.find(c=>s.includes(c.name.toLowerCase().split(/[ &]/)[0]));
 if(c&&/spen|spent|cost|much/.test(s)){const v=catSpent(c.id);return `You've spent <b>${ugx(v)}</b> on ${c.name} this cycle${c.budget?`, ${Math.round(v/c.budget*100)}% of the ${ugx(c.budget)} limit`:''}.`}
 return 'I can answer questions about this cycle\'s spending, budgets, bills, goals and loans. Try "Am I on track this month?" or "How much did I spend on food?"'};
