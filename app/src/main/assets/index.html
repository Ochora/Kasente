ACT.theme=a=>{S.settings.theme=a;if(a==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',a);refresh()};

/* ---------- start ---------- */
window.kasenteBoot=function(){
 const had=load();if(window.kasenteMigrate)kasenteMigrate(had);S.settings.payday=S.settings.payday||25;
 if(S.settings.theme&&S.settings.theme!=='system')document.documentElement.setAttribute('data-theme',S.settings.theme);
 tick();render();
 if(!had){showOnboard(0);return}
 if(S.settings.lock&&S.settings.pin)showLock();
 setTimeout(()=>smsSync(false),500);
 matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{lastBars='';applyBars()});
};

/* ===== Account: sign in with a Microsoft email, data kept in the user's own OneDrive ===== */
const CLOUD_FILE='kasente-data.json';
const cloudReady=()=>{try{return !!(NATIVE&&NATIVE.cloudConfigured&&NATIVE.cloudConfigured())}catch(e){return false}};
const cloudSignedIn=()=>{try{return !!(NATIVE&&NATIVE.cloudSignedIn&&NATIVE.cloudSignedIn())}catch(e){return false}};
const cloudWait={};
function cloudCall(op,name,body){return new Promise(res=>{const id='c'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);cloudWait[id]=res;
 try{NATIVE.cloudCall(op,name||'',body||'',id)}catch(e){delete cloudWait[id];res({ok:false,status:0,text:String(e)})}
 setTimeout(()=>{if(cloudWait[id]){delete cloudWait[id];res({ok:false,status:0,text:'timeout'})}},90000)})}
window.kasenteCloud=(id,ok,status,text)=>{const r=cloudWait[id];if(r){delete cloudWait[id];r({ok,status,text})}};
const MS_ICON='<svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#F25022"/><rect x="11" y="1" width="9" height="9" fill="#7FBA00"/><rect x="1" y="11" width="9" height="9" fill="#00A4EF"/><rect x="11" y="11" width="9" height="9" fill="#FFB900"/></svg>';
const timeAgo=ms=>{if(!ms)return 'never';const m=Math.round((Date.now()-ms)/60000);if(m<1)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+' h ago';return dlabel(new Date(ms))};

/* what counts as a change worth syncing */
const dataSig=()=>JSON.stringify(S,(k,v)=>(k==='ui'||k==='updatedAt'||k==='account'||k==='notifs')?undefined:v);
let lastSig='',syncTimer=null,syncing=false;
const baseSave=save;
save=function(){if(!S.mode)return;recordDaily();const sig=dataSig();if(sig!==lastSig){if(lastSig)S.updatedAt=Date.now();lastSig=sig;queueUpload()}try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}};
function queueUpload(){if(!isFresh()||!S.account||!cloudSignedIn())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushCloud(false),6000)}
async function pushCloud(manual){if(!S.account||syncing)return;if(!isFresh()){if(manual)toast('OneDrive keeps your own data, not the sample.','cloud');return}
 syncing=true;S.updatedAt=S.updatedAt||Date.now();
 const r=await cloudCall('put',CLOUD_FILE,JSON.stringify({app:'kasente',v:1,updatedAt:S.updatedAt,data:S}));syncing=false;
 if(r.ok){S.account.lastSync=Date.now();S.account.problem=null;try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}if(manual)toast('Saved to your OneDrive','cloud');if(cur()==='settings')refresh()}
 else cloudProblem(r,manual)}
function cloudProblem(r,manual){S.account.problem=r.status===401?'signin':'offline';if(manual||r.status===401)toast(r.status===401?'OneDrive needs you to sign in again. Open Settings → Account.':"Couldn't reach OneDrive. Kasente will try again later.",'cloud');if(cur()==='settings')refresh()}
function replaceFrom(remote,acc){const keepTheme=S.settings&&S.settings.theme;Object.assign(S,remote);S.account=acc;S.mode=S.mode||'fresh';if(keepTheme&&!S.settings.theme)S.settings.theme=keepTheme;bumpIds();tick();lastSig=dataSig()}
async function pullCloud(manual){if(!S.account||!isFresh())return;const r=await cloudCall('get',CLOUD_FILE);
 if(r.status===404){pushCloud(manual);return}
 if(!r.ok){cloudProblem(r,manual);return}
 let p;try{p=JSON.parse(r.text)}catch(e){if(manual)toast("The OneDrive copy couldn't be read.",'alert');return}
 if(p&&p.data&&(p.updatedAt||0)>(S.updatedAt||0)+1000){replaceFrom(p.data,{...S.account,lastSync:Date.now(),problem:null});render();toast('Updated with your latest data from OneDrive','cloud')}
 else if((S.updatedAt||0)>(p.updatedAt||0)+1000)pushCloud(manual);
 else{S.account.lastSync=Date.now();S.account.problem=null;if(manual)toast('Already up to date','cloud');if(cur()==='settings')refresh()}}

ACT.signIn=()=>{if(!cloudReady()){toast(NATIVE?"Sign-in isn't switched on in this build yet.":'Sign-in works in the Android app.','info');return}toast('Opening Microsoft sign-in…','cloud');try{NATIVE.cloudSignIn()}catch(e){toast("Couldn't open sign-in.",'alert')}};
window.kasenteOnSignIn=(ok,msg)=>{if(!ok){toast(msg||"Sign-in didn't finish.",'alert');return}afterSignIn()};
async function afterSignIn(){
 toast('Signed in. Checking your OneDrive…','cloud');
 const me=await cloudCall('me');if(!me.ok){toast("Signed in, but couldn't read your account details. Try again from Settings.",'alert');return}
 let u={};try{u=JSON.parse(me.text)}catch(e){}
 const acc={provider:'onedrive',email:u.mail||u.userPrincipalName||'',name:u.displayName||'',since:Date.now(),lastSync:0};
 const r=await cloudCall('get',CLOUD_FILE);let remote=null;
 if(r.ok){try{const p=JSON.parse(r.text);remote=p&&p.data?p:null}catch(e){}}
 else if(r.status!==404){S.account=acc;cloudProblem(r,true);return}
 if(remote&&(!S.mode||(isFresh()&&!S.txns.length))){replaceFrom(remote.data,{...acc,lastSync:Date.now()});$('#onb').hidden=true;stack=['home'];render();toast(`Welcome back, ${esc((S.user&&S.user.name)||acc.name)}. Your data is restored from OneDrive.`,'cloud');return}
 S.account=acc;
 if(!S.mode){ACT.onbSetup();return}
 if(remote){window._remote=remote;openSheet('Your OneDrive already has Kasente data',`<div class="stack"><dl class="kv"><dt>Saved</dt><dd>${remote.updatedAt?dlabel(new Date(remote.updatedAt))+' '+hhmm(new Date(remote.updatedAt)):'—'}</dd><dt>Transactions</dt><dd>${(remote.data.txns||[]).length}</dd><dt>On this phone</dt><dd>${S.txns.length} transactions</dd></dl><button class="btn primary" data-act="useRemote">Use the OneDrive data</button><button class="btn" data-act="useLocal">Keep this phone's data</button><p class="xs muted">The option you don't pick is replaced.</p></div>`);return}
 if(isFresh())pushCloud(true);else{refresh();toast('Signed in. Switch to your own data to start saving to OneDrive.','cloud')}}
ACT.useRemote=()=>{const r=window._remote;window._remote=null;if(!r)return;replaceFrom(r.data,{...S.account,lastSync:Date.now()});closeSheet();stack=['home'];render();toast('Using your OneDrive data','cloud')};
ACT.useLocal=()=>{window._remote=null;closeSheet();if(!isFresh()){toast('Switch to your own data first, then save to OneDrive.','cloud');return}S.updatedAt=Date.now();pushCloud(true)};
ACT.cloudPush=()=>pushCloud(true);
ACT.cloudPull=()=>pullCloud(true);
ACT.signOut=()=>openSheet('Sign out of Microsoft?',`<div class="stack"><p>Your data stays on this phone and in your OneDrive. Kasente stops saving changes to OneDrive until you sign in again.</p><button class="btn danger" data-act="signOutYes">Sign out</button><button class="btn" data-act="close">Cancel</button></div>`);
ACT.signOutYes=()=>{try{NATIVE.cloudSignOut()}catch(e){}S.account=null;closeSheet();refresh();toast('Signed out')};

/* sign-in step at the top of setup */
const baseSetup=ACT.onbSetup;
ACT.onbSetup=()=>{baseSetup();const form=document.querySelector('#onb form[data-form="setup"]');if(!form)return;
 const acc=S.account;
 const box=acc?`<div class="card row" style="padding:12px 14px"><span class="avatar">${initials(acc.name||acc.email)}</span><div class="grow"><b>Signed in</b><div class="small muted" style="overflow-wrap:anywhere">${esc(acc.email)}</div></div><span class="pill good">${ic('check',12)} OneDrive</span></div><p class="xs muted">Your data will be kept in your OneDrive, in Apps › Kasente.</p>`
 :`<div class="card stack" style="gap:10px"><b>Your account</b><p class="small muted">Sign in with your Microsoft email (Outlook, Hotmail, Live or a work account). Kasente keeps your data in your own OneDrive, so reinstalling or changing phones loses nothing.</p><button type="button" class="btn block" style="background:var(--surface);border:1px solid var(--line)" data-act="signIn" ${cloudReady()?'':'disabled'}>${MS_ICON}Sign in with Microsoft</button><button type="button" class="btn block" disabled>Google Drive · coming soon</button><p class="xs muted">${cloudReady()?'Or skip this and keep everything on this phone only.':NATIVE?"Sign-in isn't switched on in this build yet. You can keep everything on this phone for now.":'Sign-in works in the Android app.'}</p></div>`;
 form.insertAdjacentHTML('afterbegin',box);
 if(acc&&acc.name){const n=$('#setupName');if(n&&!n.value)n.value=acc.name.split(/\s+/)[0]}};

/* account section in Settings */
const baseSettings=SCREENS.settings;
SCREENS.settings=()=>{const acc=S.account;let sec;
 if(acc)sec=`<div class="list"><div class="setrow"><span class="chip sm" style="--c:#0078D4">${ic('cloud',18)}</span><span class="grow"><b style="overflow-wrap:anywhere">${esc(acc.email)}</b><span>Microsoft account · OneDrive › Apps › Kasente</span></span></div>
  <div class="setrow"><span class="grow"><b>${acc.problem==='signin'?'Sign in again to keep saving':acc.problem==='offline'?'Waiting for a connection':isFresh()?'Saved automatically':'Not saving sample data'}</b><span>Last saved ${timeAgo(acc.lastSync)}</span></span>${acc.problem?`<span class="pill ${acc.problem==='signin'?'bad':'warn'}">${acc.problem==='signin'?'Action needed':'Offline'}</span>`:`<span class="pill good">${ic('check',12)} On</span>`}</div>
  ${acc.problem==='signin'?`<button class="setrow" data-act="signIn"><span class="grow"><b>Sign in again</b><span>${esc(acc.email)}</span></span>${ic('chev',16)}</button>`:''}
  <button class="setrow" data-act="cloudPush"><span class="grow"><b>Save to OneDrive now</b><span>Changes also save by themselves a few seconds after you make them</span></span>${ic('upload',18)}</button>
  <button class="setrow" data-act="cloudPull"><span class="grow"><b>Get the latest from OneDrive</b><span>Use this after changing something on another phone</span></span>${ic('down',18)}</button>
  <button class="setrow" data-act="signOut"><span class="grow"><b>Sign out</b><span>Data stays on this phone and in OneDrive</span></span>${ic('x',18)}</button></div>`;
 else sec=`<div class="card stack" style="gap:10px"><p class="small">Sign in with your Microsoft email to keep your data in your own OneDrive. You can then reinstall Kasente or move to a new phone without losing anything.</p><button class="btn block" style="background:var(--surface);border:1px solid var(--line)" data-act="signIn" ${cloudReady()?'':'disabled'}>${MS_ICON}Sign in with Microsoft</button><button class="btn block" disabled>Google Drive · coming soon</button>${cloudReady()?'':`<p class="xs muted">${NATIVE?"Sign-in isn't switched on in this build yet.":'Sign-in works in the Android app.'}</p>`}</div>`;
 const html=baseSettings();const at=html.indexOf('<div class="sec-head"><h2>Pay cycle</h2></div>');
 return html.slice(0,at)+`<div class="sec-head"><h2>Account</h2></div>${sec}`+html.slice(at).replace("Uninstalling the app deletes its data. Updating to a newer test build keeps it.",acc?'Your OneDrive copy stays even if you uninstall the app.':'Uninstalling the app deletes its data unless you sign in or save a backup. Updating to a newer test build keeps it.')};

/* on open and on return to the app */
const baseResume=window.kasenteOnResume;
window.kasenteOnResume=away=>{baseResume(away);if(S.account&&away>30000)pullCloud(false)};
setTimeout(()=>{if(!NATIVE)return;
 if(cloudSignedIn()&&!S.account){afterSignIn();return}
 if(S.account&&!cloudSignedIn()){S.account.problem='signin';return}
 if(S.account)pullCloud(false)},900);
const baseSetupForm=FORMS.setup;
FORMS.setup=(fd,f)=>{baseSetupForm(fd,f);if(S.account&&isFresh()){S.updatedAt=Date.now();setTimeout(()=>pushCloud(false),1500)}};

</script>

 if(invOut){catId='savings';sub='Investment'}

function applySms(r,quiet){if(!r)return 0;let n=0;

 const a=acctForProvider(r.pid,r.cur);
 if(r.limits){if(r.limits.kind==='adv')a.advLimit=r.limits.amt;else a.loanLimit=r.limits.amt;pushAlert(`${a.name}: ${r.limits.kind==='adv'?'advance':'loan'} limit is ${money(r.limits.amt,a.currency)}`,'Saved on the account so you can see the credit available to you.','accounts','hand');return 1}
 if(r.invest){const h=updateHolding(r.invest,r.date);pushAlert(`${(provider(r.invest.pid)||{}).name||'Investment'}: ${r.invest.kind==='return'?'returns of':r.invest.kind==='withdrawal'?'withdrawal of':r.invest.kind==='contribution'?'contribution of':'deposit of'} ${money(r.invest.amt,r.cur)}`,h?`Your holding is now ${ugx(h.value)}.`:'Recorded under Investments.','invest','trend');return 1}

function holdingFor(pid){const p=provider(pid)||{name:'Investment'};let h=S.inv.find(x=>x.pid===pid)||S.inv.find(x=>x.name.toLowerCase().includes((p.name||'').split(' ')[0].toLowerCase()));
 if(!h){h={id:nid('i'),pid,type:pid==='nssf-ug'?'pension':pid==='xeno'||pid==='uap-om'||pid==='britam'||pid==='icea'||pid==='sanlam'?'unit':'unit',name:p.name,detail:'Updated from messages',invested:0,value:0};S.inv.push(h)}h.pid=pid;return h}
function addToHolding(pid,amt,d){const h=holdingFor(pid);h.invested+=amt;h.value+=amt;h.last=d;h.lastAmt=amt}
function updateHolding(iv,d){const h=holdingFor(iv.pid);
 const dup=h.lastAmt===iv.amt&&h.last&&Math.abs(pd(h.last)-pd(d))<4*DAY;
 if(iv.kind==='withdrawal'){h.value=Math.max(0,h.value-iv.amt)}
 else if(iv.kind==='return'){h.value+=iv.amt}
 else if(!dup){h.value+=iv.amt;h.invested+=iv.amt}
 if(iv.value)h.value=iv.value;h.last=d;h.lastAmt=iv.amt;return h}
function pushAlert(title,body,goTo,icn){S.alerts=S.alerts||[];S.alerts.unshift({id:'al'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),title,body,go:goTo,ic:icn||'info',t:'accent',when:Date.now()});S.alerts=S.alerts.slice(0,40)}

 if(rows.length<2){toast("That file doesn't look like a statement with rows.",'alert');return}const head=rows[0].map(h=>h.toLowerCase());const iD=head.findIndex(h=>/date/.test(h)),iT=head.findIndex(h=>/desc|narr|details|particular/.test(h)),iA=head.findIndex(h=>/^amount/.test(h)),iDr=head.findIndex(h=>/debit|withdraw/.test(h)),iCr=head.findIndex(h=>/credit|deposit/.test(h));
 let n=0;rows.slice(1).forEach(c=>{const dv=c[iD>=0?iD:0];let d=smsDate(dv)||(/^\d{4}-\d{2}-\d{2}/.test(dv)?dv.slice(0,10)+' 12:00':null);if(!d)return;const title=c[iT>=0?iT:1]||'Bank transaction';let v=0;
  if(iA>=0)v=parseFloat((c[iA]||'').replace(/[^\d.-]/g,''));else v=(parseFloat((c[iCr]||'0').replace(/[^\d.]/g,''))||0)-(parseFloat((c[iDr]||'0').replace(/[^\d.]/g,''))||0);if(!v)return;
  const [cc,sub]=guessCatSub(title);addTxn({acct:(a||{}).id||'bank',kind:v>0?'in':'out',amt:Math.abs(v),cat:v>0?'income':cc,sub,title:title.slice(0,60),src:'import',d,review:true},true);n++});

/* ===== Build 3 · receipts: photo → text (on the phone) → shop, date, items, total ===== */
const RC_SKIP=/\b(sub-?\s?total|total|vat|tax|tin|change|cash|tendered|paid|balance|amount|discount|card|mobile money|momo|m-?pesa|airtel|receipt|invoice|tel|phone|mob|date|time|till|qty|items?\s*(count|sold)?|thank|served|cashier|no\.|served by|customer|efris|fdn|verification|code|plot|p\.?\s?o\.?\s?box|rounding|points|loyalty|www|email|pin)\b/i;
const RC_TOTAL=/\b(grand\s*total|total\s*(amount|due|payable|ugx|kes|tzs)?|amount\s*(due|payable)|net\s*(total|amount)|to\s*pay|total\s*incl)\b/i;
function rcNumber(tok){let s=tok.replace(/\s/g,'');
 if(/^\d{1,3}(,\d{3})+(\.\d{1,2})?$/.test(s))return parseFloat(s.replace(/,/g,''));
 if(/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(s))return parseFloat(s.replace(/\./g,'').replace(',','.'));
 if(/^\d+[.,]\d{1,2}$/.test(s))return parseFloat(s.replace(',','.'));
 if(/^\d+$/.test(s))return parseFloat(s);return NaN}
function rcRowAmount(text){const m=text.match(/(\d{1,3}(?:[,.\s]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(?:\/=|\/-|=|[A-Za-z]{1,3})?\s*$/);if(!m)return null;
 const v=rcNumber(m[1]);if(!(v>0)||v>1e9)return null;const before=text.slice(0,m.index).trim();
 if(/[:]\s*$/.test(before)&&/time|date/i.test(before))return null;return{v,before}}
function rcRows(input){let lines=(input.lines||[]).filter(l=>l.t&&l.t.trim());
 if(!lines.length||lines.every(l=>l.y==null))return String(input.text||'').split(/\n/).map(t=>t.trim()).filter(Boolean);
 const hs=lines.map(l=>l.h||20).sort((a,b)=>a-b);const tol=(hs[Math.floor(hs.length/2)]||20)*.6;
 lines=lines.map(l=>({...l,cy:l.y+(l.h||0)/2})).sort((a,b)=>a.cy-b.cy);const rows=[];
 lines.forEach(l=>{const r=rows.find(r=>Math.abs(r.cy-l.cy)<=tol);if(r){r.items.push(l);r.cy=(r.cy*(r.items.length-1)+l.cy)/r.items.length}else rows.push({cy:l.cy,items:[l]})});
 return rows.sort((a,b)=>a.cy-b.cy).map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.t.trim()).join('  '))}
function rcDate(text){const M='jan feb mar apr may jun jul aug sep oct nov dec'.split(' ');let m;
 if((m=text.match(/\b(20\d{2})[-\/.](\d{1,2})[-\/.](\d{1,2})\b/)))return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
 if((m=text.match(/\b(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})\b/))){let d=+m[1],mo=+m[2],y=+m[3];if(y<100)y+=2000;if(mo>12&&d<=12)[d,mo]=[mo,d];if(mo>=1&&mo<=12&&d>=1&&d<=31&&y>2000&&y<2100)return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
 if((m=text.match(/\b(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*[\s,.-]*(\d{2,4})\b/i))){let y=+m[3];if(y<100)y+=2000;return `${y}-${String(M.indexOf(m[2].toLowerCase())+1).padStart(2,'0')}-${String(+m[1]).padStart(2,'0')}`}
 if((m=text.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*\s*(\d{1,2}),?\s*(\d{4})\b/i)))return `${m[3]}-${String(M.indexOf(m[1].toLowerCase())+1).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
 return null}
function parseReceipt(input){const rows=rcRows(input);const text=rows.join('\n');
 const isJunk=r=>/^\+?\d[\d\s-]{7,}$/.test(r.trim())||/\b(tel|tin|mob|phone|p\.?o\.?\s?box|www\.|@)\b/i.test(r);
 let merchant='';for(const r of rows.slice(0,5)){const letters=(r.match(/[A-Za-z]/g)||[]).length;if(letters>=3&&!isJunk(r)&&!rcDate(r)&&!/^(receipt|invoice|tax invoice|cash sale|sales receipt|welcome)$/i.test(r.trim())&&!/\b(plot|road|rd\.?|street|st\.|avenue|box)\b/i.test(r)){merchant=r.replace(/\s{2,}/g,' ').trim();break}}
 let totalIdx=-1,total=0;rows.forEach((r,i)=>{if(RC_TOTAL.test(r)&&!/sub-?\s?total/i.test(r)){const a=rcRowAmount(r)||rcRowAmount((rows[i+1]||''));if(a&&(/grand|payable|due/i.test(r)||a.v>=total)){total=a.v;totalIdx=i}}});
 const items=[];const end=totalIdx>=0?totalIdx:rows.length;let pending='';
 for(let i=0;i<end;i++){const r=rows[i];if(merchant&&r.replace(/\s{2,}/g,' ').trim()===merchant)continue;if(isJunk(r)||rcDate(r)&&!/[a-z]{4}/i.test(r.replace(rcDate(r)||'','')))continue;
  const a=rcRowAmount(r);const letters=(r.match(/[A-Za-z]/g)||[]).length;
  if(!a){if(letters>=3&&!RC_SKIP.test(r))pending=r;continue}
  let name=a.before.replace(/\s*\d+(?:[.,]\d+)?\s*[x@*×]\s*[\d,.]+\s*$/i,'').replace(/\s*[x@*×]\s*\d+\s*$/i,'').replace(/^\d+\s*[x@*×]?\s+/,'').replace(/\s{2,}/g,' ').trim();
  if((name.match(/[A-Za-z]/g)||[]).length<2){if(pending){name=pending}else continue}
  if(RC_SKIP.test(name))continue;pending='';
  if(a.v>(total||Infinity))continue;items.push([cap(name.toLowerCase()).slice(0,48),a.v])}
 if(!total){const all=rows.filter(r=>!isJunk(r)).map(rcRowAmount).filter(Boolean).map(a=>a.v);total=all.length?Math.max(...all):0}
 const sum=items.reduce((s,x)=>s+x[1],0);
 return{merchant:merchant?titleCase(merchant).slice(0,60):'',date:rcDate(text),items,total,sum,rows}}

function monthly(kind){const span=60;const since=plusDays(TODAY0,-span);const first=S.txns.length?Math.min(...S.txns.map(t=>pd(t.d).getTime())):Date.now();
 const days=Math.max(7,Math.min(span,(Date.now()-Math.max(first,since.getTime()))/DAY));const v=sumAmt(S.txns.filter(t=>t.kind===kind&&pd(t.d)>=since));return v/days*30.4}

const savingsNow=()=>S.accounts.filter(a=>a.kind==='sacco').reduce((s,a)=>s+inHome(a),0);
const creditLeft=()=>S.accounts.reduce((s,a)=>s+(Math.max(0,(a.advLimit||0)-(a.advUsed||0))+Math.max(0,(a.loanLimit||0)-(a.loanOwed||0)))*acctRate(a),0);
function wellness(){const inc=monthly('in'),out=monthly('out');const debt=providerDebt()+loansTaken();
 if(!inc&&!out)return null;

 return{score:Math.round(save+buffer+debtS+budS),parts:[['Saving',save,`You keep ${Math.round(sRate*100)}% of what comes in. Aim for 20%.`],['Safety buffer',buffer,`Money you can use covers ${cover.toFixed(1)} months of spending. Aim for 3.`],['Debt',debtS,debt?`What you owe equals ${(dti).toFixed(1)} months of income.`:'You owe nothing. Well done.'],['Budget',budS,bud.length?`${within} of ${bud.length} categories are within pace.`:'Set budget limits to score this.']],inc,out,cover,dti,sRate}}

/* ===== Build 3 · Advisor: Ask, Learn, My review ===== */
const LESSONS=[
 {id:'budget',t:'Budgeting when income changes every month',ic:'chart',min:3,b:`<p>Many people in Africa earn irregular money: business sales, contracts, tips, harvests. A fixed monthly budget breaks the first time a slow month comes. Budget from your lowest normal month instead.</p><ul><li><b>Find your floor.</b> Look at the last three to six months and take the lowest income. That is what you plan your must-pay costs around: rent, food, school fees, transport, utilities.</li><li><b>Pay the essentials first.</b> When money arrives, cover the essentials before anything else.</li><li><b>Split the extra.</b> Anything above the floor gets divided, for example half to savings or debt, half to wants.</li><li><b>Keep a buffer account.</b> Good months top it up, slow months draw from it, so your spending stays steady.</li></ul><p>Kasente helps by setting limits per category and showing the even-pace line on your budget.</p>`},
 {id:'buffer',t:'Your emergency fund',ic:'shield',min:3,b:`<p>An emergency fund is money set aside only for surprises: a hospital bill, a lost job, a funeral contribution, a broken phone. Without one, surprises become debt.</p><ul><li><b>First target:</b> one month of essential spending.</li><li><b>Full target:</b> three to six months.</li><li><b>Keep it separate</b> from everyday money so it doesn't get spent. A SACCO savings account, a money market fund or a separate bank account works. Avoid locking it where you can't reach it within a few days.</li><li><b>Start small.</b> Even 5% of each payment, moved the day it arrives, adds up.</li></ul><p>Your profile shows how many months of cover you have right now.</p>`},
 {id:'mobile-credit',t:'The real cost of mobile advances and app loans',ic:'hand',min:4,b:`<p>MoMo Advance, Fuliza, MoKash, Wewole and app loans are fast, but their fees are high when you look at them over a year.</p><ul><li>A fee of 10% for a 30-day loan adds up to more than 100% a year if you keep borrowing like that.</li><li>Daily fees on overdraft-style advances add up quietly. Check the fee schedule in your provider's menu.</li><li>Late repayment can be reported to credit reference bureaus and make future borrowing harder or more expensive.</li></ul><p><b>Use them for true emergencies, not regular spending.</b> If you find yourself borrowing every month before payday, your budget is short by about that amount. Fix the budget or build a small buffer, then stop the cycle.</p><p>Kasente tracks advances on each account so you can see what you owe and what the next payment into your wallet will recover.</p>`},
 {id:'debt',t:'Getting out of debt',ic:'trend',min:3,b:`<p>List everything you owe: who, how much, the fee or interest, and the due date. Then choose a method.</p><ul><li><b>Avalanche:</b> pay the minimum on everything and put every extra shilling on the debt with the highest cost. This saves the most money.</li><li><b>Snowball:</b> pay off the smallest debt first, then roll that payment into the next. The quick wins keep you motivated.</li></ul><p>Either works if you stick to it. Talk to lenders early if you can't pay; many will agree a plan before the debt goes to collection. Don't take a new loan to pay an old one unless it clearly costs less.</p>`},
 {id:'sacco',t:'SACCOs and savings groups',ic:'coins',min:3,b:`<p>A SACCO is a savings and credit co-operative owned by its members. Savings groups (VSLAs, chamas, ekibiina) work in a similar spirit with a smaller circle of people.</p><ul><li><b>Good for:</b> saving regularly, borrowing at fair member rates, and sometimes earning a yearly dividend on shares.</li><li><b>Before joining a SACCO:</b> check that it is registered and regulated, ask for the latest audited accounts, and find out how long withdrawals take.</li><li><b>In a group:</b> agree written rules on contributions, loans, interest and what happens if someone leaves or doesn't pay.</li></ul><p>Record SACCO and group savings as accounts in Kasente so they count in your net worth.</p>`},
 {id:'tbills',t:'Treasury bills and bonds',ic:'calendar',min:3,b:`<p>Treasury bills and bonds are loans you make to your government. They are among the safest places for money you won't need for a while.</p><ul><li><b>Bills</b> are short term (in Uganda: 91, 182 and 364 days). You pay less than the face value and receive the full amount at the end.</li><li><b>Bonds</b> are longer (2 to 20 years) and pay interest twice a year.</li><li>Rates are set at regular auctions run by the central bank. Interest is taxed, so compare after-tax returns.</li><li>You can usually buy through the central bank's online platform, a commercial bank, or a licensed broker.</li></ul><p>Selling a bond before it matures depends on finding a buyer at the going price, so match the term to when you'll need the money.</p>`},
 {id:'unit',t:'Unit trusts and money market funds',ic:'chart',min:3,b:`<p>A unit trust pools money from many people and is run by a licensed fund manager. You own units whose value moves with the fund.</p><ul><li><b>Money market funds</b> invest in short-term deposits and government bills. They are steady and you can usually withdraw within a few days, so they suit emergency funds and short goals.</li><li><b>Balanced and equity funds</b> include company shares. They can grow more over years but also fall.</li><li>Check the manager is licensed by the capital markets regulator, and look at the fees and past returns, not just adverts.</li></ul><p>Apps such as Xeno in Uganda make regular small contributions easy. Kasente can record their confirmation messages under Investments.</p>`},
 {id:'retire',t:'Planning for retirement',ic:'house',min:3,b:`<p>Retirement feels far away, but small amounts started early grow the most.</p><ul><li><b>In Uganda,</b> formal employees contribute to NSSF: the employer pays 10% of salary and the employee 5%. Check your statement regularly to make sure contributions are arriving.</li><li><b>Voluntary saving</b> on top of NSSF, through a pension plan, unit trust or bonds, fills the gap, especially for self-employed people.</li><li><b>Avoid using retirement money early.</b> It's the hardest money to replace.</li></ul>`},
 {id:'scams',t:'Staying safe from money scams',ic:'shield',min:3,b:`<p>Scammers target mobile money users every day. The common tricks:</p><ul><li><b>"I sent money to you by mistake, please send it back."</b> Check your actual balance in the official menu, not the SMS. Fake SMS messages look real.</li><li><b>Calls from "customer care"</b> asking for your PIN or a code. No real provider ever asks for your PIN.</li><li><b>Prizes and promotions</b> that ask you to pay a fee or dial a code to claim.</li><li><b>Investment schemes</b> promising very high, guaranteed returns or paying you for bringing in new members.</li></ul><p>Never share your PIN or one-time codes. If in doubt, hang up and call the provider's official number yourself.</p>`},
 {id:'family',t:'Supporting family without going broke',ic:'people',min:3,b:`<p>Supporting parents, siblings and relatives is part of life for many people. It works best when it's planned, not reactive.</p><ul><li><b>Set a monthly family-support amount</b> in your budget and stick to it.</li><li><b>Be open with your household</b> about what you can give, so requests don't become surprises.</li><li><b>Help in ways that last:</b> school fees paid directly to the school, or start-up help for a small business, rather than repeated cash.</li><li><b>Keep your own safety buffer first.</b> You can't help anyone if you fall into debt.</li></ul><p>Kasente's Family category and household mode show exactly how much goes to supporting others.</p>`},
 {id:'health',t:'Health costs and insurance',ic:'cross',min:3,b:`<p>Health spending is one of the biggest reasons households fall into debt.</p><ul><li><b>Track it:</b> pharmacy, clinic, lab tests, dental and eye care. Kasente groups them under Health.</li><li><b>Compare insurance with what you actually spend.</b> If a family member needs regular care, a plan may cost less than paying each visit.</li><li><b>Read what a plan covers:</b> outpatient or only inpatient, which hospitals, waiting periods, and limits.</li><li><b>Keep part of your emergency fund</b> for health surprises.</li></ul>`},
 {id:'fees',t:'Planning for school fees',ic:'book',min:2,b:`<p>School fees arrive at the same times every year, so they shouldn't be a surprise.</p><ul><li>Divide each term's fees by the months until it's due, and save that amount every month in a separate goal.</li><li>Ask the school about paying in instalments.</li><li>Uniforms, books and transport add more on top of tuition. Include them in your goal.</li></ul><p>Create a savings goal in Kasente for each term and it will tell you if you're on track.</p>`},
 {id:'business',t:'Keep business and personal money apart',ic:'bag',min:2,b:`<p>Mixing business takings with household money is the fastest way to lose track of whether a business is making a profit.</p><ul><li>Use a separate mobile money line or account for the business.</li><li>Pay yourself a fixed amount from the business each week or month, like a salary.</li><li>Record stock purchases and sales, even roughly.</li></ul><p>In Kasente, add the business wallet as its own account and use the Business category for its costs.</p>`}];

/* ---------- anonymised summary (what the Claude advisor would see) ---------- */
function financeSummary(){const since=plusDays(TODAY0,-60);const l=S.txns.filter(t=>pd(t.d)>=since);const out=l.filter(t=>t.kind==='out');const w=wellness();
 return{country:country()[1],currency:CUR(),pay_cycle:`${ymd(CYCLE_START)} to ${ymd(CYCLE_END)}`,day_of_cycle:DAY_OF_CYCLE,
  monthly_income_est:Math.round(monthly('in')),monthly_spending_est:Math.round(monthly('out')),
  spending_last_60_days_by_category:Object.fromEntries(groupSum(out,t=>(cat(t.cat)||{}).name||t.cat)),
  biggest_subcategories:Object.fromEntries(groupSum(out,t=>subOf(t)||'unspecified').slice(0,8)),
  fees_last_60_days:sumAmt(out.filter(t=>t.sub==='Mobile money & bank fees')),
  this_cycle_budget:{total:totalBudget(),spent:cycleSpent(),over:S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget).map(c=>c.name)},
  money_available_now:Math.round(liquidNow()),savings:Math.round(savingsNow()),investments:Math.round(invTotal()),assets:Math.round(assetTotal()),
  owed_to_providers:Math.round(providerDebt()),borrowed_from_people:Math.round(loansTaken()),owed_by_people:Math.round(owedToMe()),
  advances_used_last_60_days:l.filter(t=>t.kind==='borrow').length,
  goals:S.goals.map(g=>({target:g.target,saved:g.saved,due:g.date})),household_members:S.household?S.household.members.length:1,
  wellness_score:w?w.score:null}}
const AI_SYSTEM=()=>`You are Kasente's money coach for everyday people in ${country()[1]} and across Africa. You receive an anonymised summary of the person's finances (no names or transactions) and a question. Answer in plain, warm, practical language a busy person can act on today. Use ${CUR()} for amounts. Refer to local realities where useful: mobile money, SACCOs, savings groups, Treasury bills, NSSF, school fees, supporting family. Keep it under 220 words. Use short paragraphs or "- " bullets, no headings, no markdown tables. Never ask for PINs or account numbers. This is general education, not regulated financial advice; say so in one short line only if recommending an investment.`;
const aiOn=()=>{try{return !!(NATIVE&&NATIVE.hasAiKey&&NATIVE.hasAiKey()&&S.settings.useClaude!==false)}catch(e){return false}};
function aiAsk(q){return new Promise(res=>{const id='ai'+Date.now().toString(36);cloudWait[id]=res;try{NATIVE.aiAsk(AI_SYSTEM(),`My finances (anonymised):\n${JSON.stringify(financeSummary())}\n\nMy question: ${q}`,id)}catch(e){delete cloudWait[id];res({ok:false,status:0,text:String(e)})}setTimeout(()=>{if(cloudWait[id]){delete cloudWait[id];res({ok:false,status:0,text:'timeout'})}},100000)})}
const mdLite=t=>{const lines=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split('\n');let html='',inList=false;lines.forEach(l=>{const m=l.match(/^\s*[-•*]\s+(.*)/);if(m){if(!inList){html+='<ul>';inList=true}html+=`<li>${m[1]}</li>`}else{if(inList){html+='</ul>';inList=false}if(l.trim())html+=`<p style="margin:0 0 6px">${l}</p>`}});if(inList)html+='</ul>';return html};

/* ---------- personal review from your own history ---------- */
function reviewItems(){const out=[];const w=wellness();const since=plusDays(TODAY0,-60);const l60=S.txns.filter(t=>pd(t.d)>=since);
 if(!S.txns.filter(t=>t.kind==='out').length)return[{t:'Log a week of spending first',b:'Your review is built from what you actually spend. Log your expenses for a week, or let Kasente read your MoMo messages, and come back.',a:['add','Log an expense'],k:'info'}];
 if(w&&w.out){const cover=liquidNow()/w.out;if(cover<1)out.push({t:'Build a safety buffer',b:`Money you can use covers ${cover.toFixed(1)} months of spending. A first target of one month is about ${ugx(Math.round(w.out/1000)*1000)}. Moving 5–10% of every payment into a separate goal gets you there.`,a:['goalBuffer','Create a buffer goal'],k:'warn'});else if(cover<3)out.push({t:'Keep growing your buffer',b:`You have ${cover.toFixed(1)} months of cover. Three months, about ${ugx(Math.round(w.out*3/1000)*1000)}, protects you from most surprises.`,a:['goalBuffer','Create a buffer goal'],k:'accent'})}
 if(w&&w.inc&&w.sRate<.1)out.push({t:w.sRate<0?'You are spending more than you earn':'Save a little more of each payment',b:w.sRate<0?`Recent spending is about ${ugx(Math.round((w.out-w.inc)/1000)*1000)} a month more than income. Look at the biggest categories in Spending and pick one to cut first.`:`You keep about ${Math.round(w.sRate*100)}% of what comes in. Try moving 10% to savings the day money arrives, before spending starts.`,a:['go:spending','Open Spending'],k:'bad'});
 const adv=l60.filter(t=>t.kind==='borrow');const owe=providerDebt();if(adv.length>=2||owe)out.push({t:'Mobile advances and loans',b:`${adv.length?`You took ${adv.length} advance${adv.length>1?'s':''} or loan${adv.length>1?'s':''} in the last 60 days. `:''}${owe?`You owe providers ${ugx(owe)}. `:''}Regular borrowing before payday means your budget is short by about that amount. A small buffer breaks the cycle and saves the fees.`,a:['lesson:mobile-credit','Read: the real cost'],k:'warn'});
 const prevC=S.txns.filter(t=>t.kind==='out'&&pd(t.d)>=PREV_START&&pd(t.d)<CYCLE_START);if(prevC.length>5){const frac=Math.min(1,DAY_OF_CYCLE/CYCLE_DAYS);const grow=S.cats.map(c=>{const now=catSpent(c.id),then=sumAmt(prevC.filter(t=>t.cat===c.id))*frac;return{c,now,then,g:then?(now-then)/then:0}}).filter(x=>x.then>5000&&x.g>.2).sort((a,b)=>b.g-a.g)[0];
  if(grow)out.push({t:`${grow.c.name} is rising`,b:`You've spent ${ugx(grow.now)} on ${grow.c.name.toLowerCase()} so far this cycle, about ${Math.round(grow.g*100)}% more than at the same point last cycle.`,a:['spTx:'+grow.c.id,'See the payments'],k:'warn'})}
 const over=S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget);if(over.length)out.push({t:`Over budget: ${over.map(c=>c.name).join(', ')}`,b:'Either the limit is unrealistic or spending needs to come down. Adjust the limit to what you can really live on, then hold to it.',a:['go:budgets','Review budgets'],k:'bad'});
 if(!S.cats.some(c=>c.budget))out.push({t:'Set your budget limits',b:'Limits per category are what make alerts and pace tracking work.',a:['go:budgets','Set limits'],k:'accent'});
 const fees=sumAmt(l60.filter(t=>t.sub==='Mobile money & bank fees'));if(fees>0)out.push({t:`${ugx(fees)} spent on fees in 60 days`,b:'Sending fewer, larger amounts, paying merchants directly from your wallet, and avoiding cash withdrawals where possible all reduce fees.',a:['go:spending','See spending'],k:'accent'});
 const bet=sumAmt(l60.filter(t=>subOf(t)==='Betting & lottery'));if(bet)out.push({t:`${ugx(bet)} on betting in 60 days`,b:'If betting is entertainment, set a fixed monthly limit for it in your budget and stop when it is used.',a:['go:budgets','Set a limit'],k:'warn'});
 const health=sumAmt(l60.filter(t=>t.cat==='health'));if(health>50000&&!l60.some(t=>subOf(t)==='Health insurance'))out.push({t:'Compare health insurance',b:`You spent ${ugx(health)} on health in 60 days. Ask a few insurers what a plan would cost and compare.`,a:['lesson:health','Read: health costs'],k:'accent'});
 const late=S.loans.filter(l=>l.dir==='out'&&l.amt>l.paid&&daysUntil(l.due)<0);if(late.length)out.push({t:`${late.length} person${late.length>1?'s':''} owe${late.length>1?'':'s'} you past the agreed date`,b:`${ugx(late.reduce((s,l)=>s+l.amt-l.paid,0))} outstanding. A friendly reminder now is easier than later.`,a:['go:lending','Open lending'],k:'warn'});
 if(!S.goals.length)out.push({t:'Give your savings a purpose',b:'People save more when the money has a name: school fees, a phone, land. Create one goal to start.',a:['addGoal','Create a goal'],k:'accent'});
 const offPace=S.goals.filter(g=>g.rate<goalNeed(g)*.97);if(offPace.length)out.push({t:`${offPace.length} goal${offPace.length>1?'s are':' is'} behind`,b:offPace.map(g=>`${g.name}: about ${ugx(Math.round(goalNeed(g)/1000)*1000)} a month needed`).join('. ')+'.',a:['go:goals','Open goals'],k:'warn'});
 if(!out.length)out.push({t:'You are doing well',b:'No warning signs in your recent history. Keep logging, and consider moving extra money into investments for longer-term goals.',a:['go:invest','Explore investments'],k:'good'});
 return out}
ACT.goalBuffer=()=>{const w=wellness();openGoal(Math.round(((w&&w.out)||300000)/1000)*1000,ymd(plusDays(TODAY0,120)));setTimeout(()=>{const n=document.querySelector('[data-form=addGoal] [name=name]');if(n)n.value='Emergency fund'},50)};
ACT.revAct=a=>{if(a.startsWith('go:'))go(a.slice(3));else if(a.startsWith('lesson:')){S.ui.adv='learn';S.ui.lesson=a.slice(7);go('advisor')}else if(a.startsWith('spTx:')){S.ui.sp='cycle';go('spending');ACT.spTx(a.slice(5))}else if(ACT[a])ACT[a]()};
ACT.askReview=()=>{S.ui.adv='review';go('advisor')};

/* ---------- the Advisor screen ---------- */
SCREENS.advisor=()=>{const tab=S.ui.adv||'ask';
 const tabs=`<div class="tabbar">${[['ask','Ask'],['learn','Learn'],['review','My review']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="advTab" data-arg="${k}">${l}</button>`).join('')}</div>`;
 if(tab==='learn')return tabs+`
 <p class="small muted" style="padding:0 2px">Short, practical notes on managing money, written for life in Africa.</p>

 const b=$('#aiOut');if(!b)return;b.innerHTML=r.ok?`<div class="card stack" style="gap:6px"><b>${ic('sparkle',16).replace('class="i"','class="i" style="display:inline;vertical-align:-2px;color:var(--accent)"')} Claude's review</b><div class="small">${mdLite(r.text)}</div></div>`:`<div class="note bad">${ic('alert')}<span class="small">${esc(r.status===401?'Your Claude API key was not accepted. Check it in Settings → Advisor.':'Claude could not be reached: '+r.text)}</span></div>`};

window.advise=function(q){const s=q.toLowerCase();
 if(isFresh()&&/better|improve|what can i do|advice|tips/.test(s)){const it=reviewItems().slice(0,4);return `Here's what stands out in your recent history:<ul>${it.map(x=>`<li><b>${x.t}.</b> ${x.b}</li>`).join('')}</ul>Open <b>My review</b> for the full list.`}
 if(isFresh()&&/health|medical|hospital|pharmacy/.test(s)&&/spen|cost|much/.test(s)){const l=expenses().filter(t=>t.cat==='health');return l.length?`You've spent <b>${ugx(sumAmt(l))}</b> on health this cycle:<ul>${groupSum(l,t=>subOf(t)||'Other').map(([n,v])=>`<li>${esc(n)}: ${ugx(v)}</li>`).join('')}</ul>`:'No health spending logged this cycle.'}
 return baseAdvise2(q)};
ask=function(q){if(!q.trim())return;pushChat(true,esc(q));if(cur()!=='advisor'){S.ui.adv='ask';go('advisor')}else refresh();

 if(aiOn()){aiAsk(q).then(r=>{pushChat(false,r.ok?mdLite(r.text):`${advise(q)}<span class="meta">Claude couldn't be reached, so this answer was worked out on the phone.</span>`);if(cur()==='advisor'){refresh();$('#view').scrollTop=$('#view').scrollHeight}});return}

/* ===== Build 3 · streaks, points and badges ===== */
TITLES.rewards='Streaks & rewards';
const BADGES=[['first-log','First entry','Logged your first expense','plus'],['streak3','3-day streak','Opened Kasente 3 days in a row','bolt'],['streak7','Full week','7 days in a row','bolt'],['streak14','Two weeks','14 days in a row','bolt'],['streak30','Habit formed','30 days in a row','sun'],
 ['budget','Budget set','Set a limit on a category','chart'],['goal','Goal setter','Created a savings goal','target'],['learner','Learner','Read 3 lessons','book'],['assets','Owner','Recorded something you own','house'],['buffer','Safety first','One month of spending saved','shield'],['clean','Debt free','No advances or loans owed','check']];
const G=()=>{S.game=S.game||{days:{},points:0,best:0,badges:[],log:[]};return S.game};
function gameStreak(){const g=G();let n=0;for(let d=new Date(TODAY0);;d=plusDays(d,-1)){const k=ymd(d);if(g.days[k]&&g.days[k].o)n++;else if(k===ymd(TODAY0))continue;else break;if(n>3650)break}return n}
window.gamePoints=(n,why)=>{const g=G();g.points+=n;g.log.unshift({d:Date.now(),p:n,why});g.log=g.log.slice(0,60)};
window.gameBadge=id=>{const g=G();if(g.badges.includes(id))return;g.badges.push(id);const b=BADGES.find(x=>x[0]===id);gamePoints(20,'Badge: '+(b?b[1]:id));if(b)setTimeout(()=>toast(`New badge: ${b[1]} · +20 points`,'sparkle'),900)};
window.gameOpen=()=>{if(!S.mode)return;const g=G();const k=ymd(TODAY0);g.days[k]=g.days[k]||{};if(g.days[k].o)return;g.days[k].o=1;
 const s=gameStreak();g.streak=s;g.best=Math.max(g.best||0,s);gamePoints(5,'Opened Kasente');
 const bonus={7:25,14:50,30:100}[s];if(bonus)gamePoints(bonus,`${s}-day streak bonus`);
 if(s>=3)gameBadge('streak3');if(s>=7)gameBadge('streak7');if(s>=14)gameBadge('streak14');if(s>=30)gameBadge('streak30');
 if(s>1)setTimeout(()=>toast(`Day ${s} of your streak · +${5+(bonus||0)} points`,'bolt'),1200);
 const k2=Object.keys(g.days).sort();if(k2.length>120)k2.slice(0,k2.length-120).forEach(x=>delete g.days[x])};
window.gameLog=()=>{const g=G();const k=ymd(TODAY0);g.days[k]=g.days[k]||{};g.days[k].l=(g.days[k].l||0)+1;if(g.days[k].l<=5)gamePoints(2,'Logged an expense');gameBadge('first-log')};
function gameChecks(){if(!S.mode)return;const g=G();if(S.cats.some(c=>c.budget)&&isFresh()&&S.cats.some(c=>c.budgetSet))gameBadge('budget');if(S.goals.length&&isFresh())gameBadge('goal');if((S.assets||[]).length&&isFresh())gameBadge('assets');
 const w=isFresh()?wellness():null;if(w&&w.out&&liquidNow()>=w.out)gameBadge('buffer');if(isFresh()&&S.txns.length>10&&!providerDebt()&&!loansTaken())gameBadge('clean');g.streak=gameStreak()}
const weekDots=()=>{const g=G();let h='';for(let i=6;i>=0;i--){const d=plusDays(TODAY0,-i);const on=g.days[ymd(d)]&&g.days[ymd(d)].o;h+=`<i class="${on?'on':''} ${i===0?'today':''}">${'SMTWTFS'[d.getDay()]}</i>`}return `<div class="week">${h}</div>`};
const streakCard=()=>{const g=G();const s=g.streak||gameStreak();return `<button class="streak" data-go="rewards"><span class="flame">${ic('bolt',24)}</span><span class="grow"><b style="font-size:15px">${s?`${s}-day streak`:'Start a streak today'}</b><span class="xs muted" style="display:block">${g.points} points · ${g.badges.length} badge${g.badges.length===1?'':'s'}</span>${weekDots()}</span>${ic('chev',16)}</button>`};
SCREENS.rewards=()=>{const g=G();const s=g.streak||gameStreak();
 return `<div class="card stack" style="align-items:center;text-align:center;gap:8px;padding:22px 16px"><span class="flame" style="width:72px;height:72px;border-radius:24px">${ic('bolt',38)}</span><div style="font-family:var(--f-display);font-weight:800;font-size:34px">${s} day${s===1?'':'s'}</div><span class="small muted">Current streak · best ${g.best||s}</span>${weekDots()}</div>
 <div class="kpi"><div class="stat"><span>Points</span><b>${g.points}</b></div><div class="stat"><span>Badges</span><b>${g.badges.length} of ${BADGES.length}</b></div></div>
 <div class="card stack" style="gap:6px"><b>Earn points</b>${[['Open Kasente each day',5],['Log an expense (up to 5 a day)',2],['Read a lesson',10],['Earn a badge',20],['7-day streak bonus',25],['14-day streak bonus',50],['30-day streak bonus',100]].map(([l,p])=>`<div class="between small"><span>${l}</span><span class="pill sun">+${p}</span></div>`).join('')}</div>
 <div class="sec-head"><h2>Badges</h2></div>
 <div class="badges">${BADGES.map(([id,n,d,i])=>`<div class="badge2 ${g.badges.includes(id)?'':'locked'}" title="${d}"><span class="bi">${ic(i,20)}</span><b>${n}</b><span class="xs muted">${d}</span></div>`).join('')}</div>
 <div class="card stack" style="gap:8px;border:1px dashed var(--line)"><b>Prizes are coming</b><p class="small muted">Points you earn now are kept. Prizes and partner rewards will be announced later; the aim for now is building healthy money habits.</p></div>
 ${g.log.length?`<div class="sec-head"><h2>Recent points</h2></div><div class="list">${g.log.slice(0,10).map(x=>`<div class="setrow" style="padding:9px 14px"><span class="grow"><b style="font-size:13.5px">${esc(x.why)}</b><span>${dlabel(new Date(x.d))}</span></span><span class="pill sun">+${x.p}</span></div>`).join('')}</div>`:''}`};
/* badges from actions */
const baseBudgetForm=FORMS.budget;FORMS.budget=(fd,f)=>{const c=cat(f.dataset.id);if(c)c.budgetSet=true;baseBudgetForm(fd,f);gameBadge('budget')};

  <div class="field"><span>Who else is in the household?</span><div class="stack" id="hhMembers" style="gap:6px">${hh.members.filter(m=>!m.me).map(memberRow).join('')||memberRow({role:'adult'})}</div><button type="button" class="link small" style="align-self:flex-start" data-act="hhAdd">+ Add a person</button><span class="xs muted">Add your partner, children and anyone whose costs you cover. Children get an allowance tracker.</span></div>

  <button class="btn primary">${inOnb?'Continue':S.household?'Save household':'Set up household'}</button>
  ${inOnb?'<button type="button" class="btn" data-act="onbNextStep" data-arg="done" style="background:transparent">Skip, do this later</button>':''}</form>`};
ACT.hhAdd=()=>{$('#hhMembers').insertAdjacentHTML('beforeend',memberRow({role:'adult'}))};
ACT.hhRm=(a,el)=>{el.closest('.hhm').remove()};
function readHousehold(f){const names=[...f.querySelectorAll('[name=mname]')].map(x=>x.value.trim()),roles=[...f.querySelectorAll('[name=mrole]')].map(x=>x.value);const old=S.household?S.household.members:[];
 const members=[{id:(old.find(m=>m.me)||{}).id||'m0',name:(S.user&&S.user.name)||'Me',role:'adult',me:true}];
 names.forEach((n,i)=>{if(!n)return;const prev=old.find(m=>!m.me&&m.name===n);members.push({...(prev||{}),id:prev?prev.id:nid('m'),name:n,role:roles[i]||'adult'})});
 return{name:f.querySelector('[name=hname]').value.trim()||'My household',members,familyBudget:+f.querySelector('[name=fbudget]').value||0}}
FORMS.household=(fd,f)=>{S.household=readHousehold(f);closeSheet();refresh();toast('Household saved')};

SCREENS.family=()=>{const hh=S.household;
 if(!hh)return `<div class="card stack" style="gap:12px"><span class="chip" style="--c:var(--accent);width:52px;height:52px">${ic('people',26)}</span><b style="font-size:18px">Manage money as a household</b><p class="small muted">Add the people you share costs with. Every expense can then be marked as yours, the household's, or for a particular person, and Kasente shows each side separately.</p><button class="btn primary" data-act="editHousehold">${ic('plus')}Set up your household</button></div>
  <div class="note">${ic('info')}<span class="small">For now the household lives on one phone. Each member using Kasente on their own phone, with shared data, comes with online sync in the next phase.</span></div>`;
 const list=expenses();const famT=sumAmt(list.filter(isFamilyTx)),meT=famSpent('me',list);const fb=hh.familyBudget;
 const kids=hh.members.filter(m=>m.role==='child');const shared=S.bills.filter(b=>b.shared&&b.status!=='paid');const hg=S.goals.filter(g=>g.family);
 return `
 <div class="card stack" style="gap:12px"><div class="between"><div><span class="eyebrow">Household</span><h2 style="font-size:20px;margin-top:2px">${esc(hh.name)}</h2></div><div class="row" style="gap:0">${hh.members.slice(0,5).map((m,i)=>`<span class="avatar" style="margin-left:${i?-10:0}px;border:2px solid var(--surface);${m.role==='child'?'background:var(--sun-soft);color:var(--warn)':''}">${initials(m.name)}</span>`).join('')}</div></div>
  <div class="stat3"><div class="stat" style="background:var(--bg)"><span>Household</span><b>${kf(famT)}</b></div><div class="stat" style="background:var(--bg)"><span>Personal</span><b>${kf(meT)}</b></div><div class="stat" style="background:var(--bg)"><span>Members</span><b>${hh.members.length}</b></div></div>

  <div class="row"><button class="btn sm grow" data-act="add">${ic('plus',16)}Log household expense</button><button class="btn sm grow" data-act="shareFamily">${ic('send',16)}Share summary</button></div></div>
 <div class="sec-head"><h2>Where household money went</h2><button class="link" data-act="famSpending">Details</button></div>
 <div class="card stack" style="gap:8px">${famT?groupSum(list.filter(isFamilyTx),t=>t.cat).slice(0,6).map(([id,v])=>`<div class="stack" style="gap:3px"><div class="between small"><span>${(cat(id)||{}).name||id}</span><span class="tnum">${num(v)}</span></div><div class="bar" style="height:6px"><i style="width:${v/famT*100}%;background:${(cat(id)||{}).c||'var(--accent)'}"></i></div></div>`).join(''):'<p class="small muted">No household expenses yet this cycle. When you log an expense, choose "The household" or a person under "For".</p>'}</div>
 <div class="sec-head"><h2>Members</h2><button class="link" data-act="editHousehold">Edit</button></div>
 <div class="list">${hh.members.map(m=>`<div class="tx" style="grid-template-columns:40px 1fr auto"><span class="avatar" style="${m.role==='child'?'background:var(--sun-soft);color:var(--warn)':''}">${initials(m.name)}</span><span class="tx-main"><span class="tx-title">${esc(m.name)}${m.me?' (you)':''}</span><span class="tx-sub">${m.role==='child'?'Child':'Adult'}${m.note?' · '+esc(m.note):''}</span></span><span class="tx-amt">${kf(m.me?meT:famSpent(m.id,list))}<small>this cycle</small></span></div>`).join('')}</div>
 ${kids.length?`<div class="sec-head"><h2>Children</h2></div>${kids.map(k=>{const given=sumAmt(list.filter(t=>t.for===k.id&&t.sub==='Children'&&/allowance|pocket/i.test(t.title)));const spentK=famSpent(k.id,list);const subs=groupSum(list.filter(t=>t.for===k.id),t=>subOf(t)||(cat(t.cat)||{}).name);
  return `<div class="card stack" style="gap:10px"><div class="between"><b>${esc(k.name)}</b><button class="link small" data-act="kidEdit" data-arg="${k.id}">Allowance</button></div>

  <button class="btn sm" data-act="giveAllowance" data-arg="${k.id}">${ic('coins',16)}Give allowance</button></div>`}).join('')}`:''}
 <div class="sec-head"><h2>Shared bills</h2><button class="link" data-go="bills">All bills</button></div>
 ${shared.length?`<div class="list">${shared.map(billRow).join('')}</div>`:'<div class="card small muted">Open any bill and switch on "Shared with household" to list it here.</div>'}
 <div class="sec-head"><h2>Household goals</h2><button class="link" data-act="famGoal">New goal</button></div>
 ${hg.length?hg.map(g=>`<div class="card stack" style="gap:8px"><div class="between"><b>${esc(g.name)}</b><span class="small muted tnum">${kf(g.saved)} / ${kf(g.target)}</span></div><div class="bar thick"><i style="width:${g.saved/g.target*100}%;background:var(--sun)"></i></div><button class="link small" style="align-self:flex-start" data-act="contrib" data-arg="${g.id}">Add money →</button></div>`).join(''):'<div class="card small muted">Save together for school fees, a holiday home visit or a family event.</div>'}

 <h2>Spending by category</h2><table>${byCat.map(([id,v])=>{const c=cat(id)||cat('other');return `<tr><td style="width:45%">${esc(c.name)}${bar(v,top,c.c)}</td><td class="r">${esc(num(v))}</td><td class="r muted">${T?Math.round(v/T*100):0}%</td></tr>`}).join('')||'<tr><td class="muted">No spending in this period.</td></tr>'}</table>
 <h2>Biggest details</h2><table>${groupSum(out,t=>subOf(t)||(cat(t.cat)||{}).name).slice(0,10).map(([n,v])=>row(n,num(v))).join('')}</table>
 ${S.cats.some(c=>c.budget)&&(S.ui.report||'monthly')==='monthly'?`<h2>Budget check</h2><table><tr><th>Category</th><th class="r">Limit</th><th class="r">Spent</th></tr>${S.cats.filter(c=>c.budget).map(c=>`<tr><td>${esc(c.name)}</td><td class="r">${num(c.budget)}</td><td class="r ${catSpent(c.id)>c.budget?'bad':''}">${num(catSpent(c.id))}</td></tr>`).join('')}</table>`:''}
 <h2>Accounts today</h2><table>${S.accounts.map(x=>row(x.name+((x.advUsed||x.loanOwed)?` (owes ${fmtNum((x.advUsed||0)+(x.loanOwed||0),x.currency)})`:''),money(x.bal,x.currency))).join('')}</table>
 ${S.bills.filter(x=>x.status!=='paid').length?`<h2>Bills coming up</h2><table>${S.bills.filter(x=>x.status!=='paid').sort((p,q)=>p.due.localeCompare(q.due)).slice(0,10).map(x=>row(`${x.name} · ${shortDate(x.due)}`,ugx(x.amt))).join('')}</table>`:''}
 ${S.goals.length?`<h2>Savings goals</h2><table>${S.goals.map(g=>row(`${g.name} · by ${shortDate(g.date)}`,`${num(g.saved)} of ${num(g.target)}`)).join('')}</table>`:''}
 <h2>Transactions</h2><table><tr><th>Date</th><th>Description</th><th>Category</th><th class="r">Amount</th></tr>${tx.slice(-120).map(t=>`<tr><td>${t.d.slice(0,10)}</td><td>${esc(t.title)}</td><td class="muted">${esc(t.kind==='out'?(subOf(t)||(cat(t.cat)||{}).name||''):kindName(t))}</td><td class="r">${effOf(t)>0?'+':'−'}${esc(num(t.amt))}</td></tr>`).join('')}</table>
 ${tx.length>120?`<p class="muted">Showing the last 120 of ${tx.length} transactions. The Excel export has all of them.</p>`:''}
 <p class="muted" style="margin-top:20px">Made with Kasente on ${new Date().toLocaleDateString()}. Figures come from what was logged on this phone.</p></body></html>`}
function exportPdf(){const html=reportHtml();if(NATIVE&&NATIVE.printHtml){try{NATIVE.printHtml('Kasente report '+ymd(TODAY0),html);toast('Choose "Save as PDF" as the printer, then tap the download button.','down');return}catch(e){}}
 openSheet('Report preview',`<iframe title="Report" srcdoc="${esc(html)}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:12px;background:#fff"></iframe><p class="xs muted" style="margin-top:8px">In the Android app this opens the print screen, where "Save as PDF" makes the file.</p>`)}
ACT.exportR=k=>{if(k==='PDF')return exportPdf();if(k==='CSV')return saveOut(`kasente-transactions-${ymd(TODAY0)}.csv`,'text/csv',toCSV2());return exportExcel()};
const toCSV2=()=>{const q=v=>`"${String(v).replace(/"/g,'""')}"`;return ['Date,Time,Account,Type,Category,Detail,For,Description,Amount ('+CUR()+'),Source'].concat(S.txns.slice().sort((a,b)=>pd(a.d)-pd(b.d)).map(t=>[t.d.slice(0,10),t.d.slice(11),(acct(t.acct)||{}).name||'',kindName(t),t.kind==='out'?(cat(t.cat)||{}).name||'':catOf(t).name,subOf(t)||'',t.kind==='out'?forName(t):'',t.title,effOf(t)>0?t.amt:-t.amt,srcTag(t.src)].map(q).join(','))).join('\n')};
const baseOpenReport2=openReport;openReport=function(k){baseOpenReport2(k);const g=document.querySelector('.sheet-body .grid2:last-child');if(g&&g.querySelector('[data-arg="Excel"]'))g.insertAdjacentHTML('afterend',`<button class="btn block" style="margin-top:10px" data-act="exportR" data-arg="CSV">${ic('down',18)}CSV (simple list)</button>`)};

/* ---------- settings additions ---------- */
const rateAge=()=>S.rates&&S.rates.at?timeAgo(S.rates.at):'built-in approximate rates';
ACT.updateRates=async()=>{if(!NATIVE||!NATIVE.fetchRates){toast('Live rates work in the Android app.','info');return}toast('Getting today\'s rates…','trend');
 const r=await new Promise(res=>{const id='fx'+Date.now();cloudWait[id]=res;try{NATIVE.fetchRates(id)}catch(e){delete cloudWait[id];res({ok:false})}setTimeout(()=>{if(cloudWait[id]){delete cloudWait[id];res({ok:false})}},25000)});
 let d=null;try{d=JSON.parse(r.text)}catch(e){}if(!r.ok||!d||!d.rates){toast("Couldn't get rates. Check your internet connection.",'alert');return}
 S.rates={perUsd:d.rates,at:Date.now()};S.accounts.forEach(a=>{if(a.currency!==CUR())a.rate=Math.round(rateOf(a.currency)*10000)/10000});refresh();toast('Exchange rates updated','trend')};
ACT.saveAiKey=()=>{const v=($('#aiKey')||{}).value||'';if(!/^sk-ant-/.test(v.trim())){toast('That doesn\'t look like a Claude API key. It starts with sk-ant-.','alert');return}try{NATIVE.setAiKey(v.trim());S.settings.useClaude=true;refresh();toast('Claude advisor switched on','sparkle')}catch(e){toast("Couldn't save the key.",'alert')}};
ACT.removeAiKey=()=>{try{NATIVE.setAiKey('')}catch(e){}refresh();toast('Key removed. The advisor works on the phone again.')};
LIVE.setCountry=el=>{const c=COUNTRIES.find(x=>x[0]===el.value);S.settings.country=el.value;if(c&&S.accounts.every(a=>!a.bal)&&!S.txns.length)S.settings.currency=c[2];refresh();toast(`Country set to ${c?c[1]:el.value}`)};
LIVE.setCurrency=el=>{const old=S.settings.currency;S.settings.currency=el.value;S.accounts.forEach(a=>{if(a.currency===old){a.currency=el.value;a.rate=null}});refresh();toast(`Main currency is now ${el.value}. Amounts are relabelled, not converted.`,'info')};
LIVE.setLang=el=>{S.settings.lang=el.value;refresh();if(window.i18nApply)i18nApply(document.getElementById('phone'))};
const baseSettings3=SCREENS.settings;
SCREENS.settings=()=>{let h=baseSettings3();const s=S.settings;const hasKey=(()=>{try{return NATIVE&&NATIVE.hasAiKey&&NATIVE.hasAiKey()}catch(e){return false}})();const foreign=S.accounts.filter(a=>a.currency!==CUR());
 const region=`<div class="sec-head"><h2>Country, currency and language</h2></div><div class="card stack">
  <div class="grid2"><label class="field"><span>Country</span><select data-live="setCountry">${countryOptions(s.country)}</select></label><label class="field"><span>Main currency</span><select data-live="setCurrency">${curOptions(s.currency)}</select></label></div>
  <label class="field"><span>Language</span><select data-live="setLang">${langOptions(s.lang)}</select></label>
  <p class="xs muted">Kiswahili and Français cover most screens; some longer texts are still in English. Translations will be checked by native speakers before launch.</p>
  <div class="between"><span class="small"><b>Exchange rates</b><br><span class="muted xs">${rateAge()}</span></span><button class="btn sm" data-act="updateRates">${ic('trend',16)}Update</button></div>
  ${foreign.length?foreign.map(a=>`<div class="between xs"><span>${esc(a.name)}</span><span class="tnum">1 ${a.currency} = ${fmtNum(acctRate(a))} ${CUR()}</span></div>`).join(''):'<p class="xs muted">Add an account in another currency under Accounts, for example a Kenyan M-Pesa line or a dollar account.</p>'}</div>`;
 const adv=`<div class="sec-head"><h2>Advisor</h2></div><div class="card stack" style="gap:10px">${hasKey?`<div class="between"><span class="small"><b>Claude advisor is on</b><br><span class="xs muted">Questions and reviews use your own Claude API key</span></span><button class="toggle ${s.useClaude!==false?'on':''}" data-act="toggle" data-arg="useClaude" aria-label="Use Claude"></button></div><button class="btn sm" data-act="removeAiKey">Remove key</button>`
  :`<p class="small">For testing, you can connect the advisor to Claude with your own API key from console.anthropic.com. Only an anonymised summary is sent: totals by category, no names, numbers or transactions.</p>${NATIVE&&NATIVE.setAiKey?`<label class="field"><span>Claude API key</span><input id="aiKey" type="password" autocomplete="off" placeholder="sk-ant-…"></label><button class="btn sm primary" data-act="saveAiKey">Save key</button>`:'<p class="xs muted">Available in the Android app.</p>'}<p class="xs muted">The key is kept in the app's private storage on this phone, not in backups or OneDrive. A public version will use a Kasente server instead, so people don't need their own key.</p>`}</div>`;
 const exp=`<div class="sec-head"><h2>Export</h2></div><div class="list"><button class="setrow" data-act="exportR" data-arg="Excel"><span class="grow"><b>Excel workbook</b><span>Transactions, accounts, budgets, bills, loans, goals and assets</span></span>${ic('down',18)}</button><button class="setrow" data-act="exportR" data-arg="PDF"><span class="grow"><b>PDF report</b><span>This pay cycle, ready to print or send</span></span>${ic('down',18)}</button><button class="setrow" data-act="exportR" data-arg="CSV"><span class="grow"><b>CSV list</b><span>Simple list that opens anywhere</span></span>${ic('down',18)}</button></div>`;
 h=h.replace(/<label class="field"><span>Language<\/span><select data-live="lang">[\s\S]*?<\/select><\/label>/,'');
 const at=h.indexOf('<div class="sec-head"><h2>Pay cycle</h2></div>');h=at>=0?h.slice(0,at)+region+h.slice(at):h+region;
 const at2=h.indexOf('<div class="sec-head"><h2>Notifications</h2></div>');h=at2>=0?h.slice(0,at2)+adv+exp+h.slice(at2):h+adv+exp;
 return h};
const baseToggle3=ACT.toggle;ACT.toggle=a=>{if(a==='useClaude'){S.settings.useClaude=S.settings.useClaude===false;refresh();return}baseToggle3(a)};
const baseSwitch=ACT.switchYes;ACT.switchYes=to=>{const lang=S.settings.lang;baseSwitch(to);if(to==='sample'){S.settings.lang=lang;kasenteMigrate(true);refresh()}};

/* ---------- notifications include message alerts ---------- */
const baseCompute=computeNotifs;computeNotifs=function(){const rd=S.readN||[];return[...(S.alerts||[]).map(a=>({...a,when:dlabel(new Date(a.when)),read:rd.includes(a.id)})),...baseCompute()]};

/* ---------- WhatsApp preview understands every format ---------- */
const baseWa=waReply;waReply=function(q){if(isFresh()&&/(sent|paid|received|withdr|confirmed|debited|credited)/i.test(q)&&smsAmounts(q).length){const r=readMoneySms(q,'');if(!r)return "I couldn't read that message. Forward the full confirmation.";const n=applySms(r);return n?`Logged ✓ <b>${money(r.amt,r.cur)}</b> · ${r.type} · ${esc(r.providerName)}${r.fee?`<br>Fee of ${money(r.fee,r.cur)} logged too.`:''}`:'Nothing to log.'}return baseWa(q)};

/* ---------- top bar, home, more ---------- */
const baseTopbar=topbar;topbar=function(c){let h=baseTopbar(c);if(c==='home'&&S.mode)h=h.replace('<div class="top-actions">',`<div class="top-actions"><button class="icon-btn" data-go="profile" aria-label="My money profile" style="font-weight:800;font-size:13px;color:var(--accent)">${initials(S.user&&S.user.name)}</button>`).replace(`<button class="icon-btn" data-act="lockNow" aria-label="Lock app">${ic('lock')}</button>`,'');return h};
const baseHome=SCREENS.home;SCREENS.home=()=>{let h=baseHome();h=h.replace('<small>UGX</small>',`<small>${CUR()}</small>`);
 const r0=h.indexOf('<div class="rail">'),r1=h.indexOf('<div class="quick">');
 if(r0>=0&&r1>r0)h=h.slice(0,r0)+`<div class="rail">${S.accounts.map(a=>{const debt=(a.advUsed||0)+(a.loanOwed||0);return `<button class="acct" data-act="acct" data-arg="${a.id}"><span class="acct-head">${acctBadge(a,30)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.name)}</span></span><span class="acct-type">${esc(KIND_LABEL[a.kind]||'')}${a.currency!==CUR()?' · '+a.currency:''}</span><span class="acct-bal">${fmtNum(a.bal,a.currency)}</span>${debt?`<span class="xs liab" style="font-weight:600">Owes ${fmtNum(debt,a.currency)}</span>`:`<div style="margin-top:6px">${spark(a.trend,130,22,'var(--accent)')}</div>`}</button>`}).join('')}<button class="acct add" data-act="addAccount">${ic('plus')}Add account</button></div>\n `+h.slice(r1);
 const s0=h.indexOf('</section>');if(s0>=0&&S.mode)h=h.slice(0,s0+10)+streakCard()+h.slice(s0+10);
 const advA=S.accounts.filter(a=>a.advUsed>0);if(advA.length){const i=h.indexOf('<div class="sec-head"><h2>Accounts</h2>');if(i>=0)h=h.slice(0,i)+advA.map(a=>`<button class="note warn" data-act="acct" data-arg="${a.id}" style="text-align:left">${ic('hand')}<span class="grow small"><b>${esc(a.name)} advance: ${money(a.advUsed,a.currency)} owed.</b> The next ${money(a.advUsed,a.currency)} you receive goes to repaying it first.</span></button>`).join('')+h.slice(i)}
 return h};
SCREENS.more=()=>{const late=S.bills.filter(b=>b.status!=='paid'&&daysUntil(b.due)<0).length,soon=S.bills.filter(b=>b.status!=='paid'&&daysUntil(b.due)>=0&&daysUntil(b.due)<=7).length;const over=S.cats.filter(c=>c.budget&&catSpent(c.id)>c.budget).length;const g=G();
 const T=(go,icn,t,s,em,act)=>`<button class="tile" ${act?`data-act="${act}"`:`data-go="${go}"`}><span class="tile-ic">${ic(icn)}</span><b>${t}</b><span>${s}</span>${em?`<em>${em}</em>`:''}</button>`;
 return `<div class="sec-head" style="margin-top:0"><h2>You</h2></div>
 <div class="tiles">${T('profile','wallet','My money profile','Net worth, debts, assets, wellness score','')}${T('rewards','bolt','Streaks & rewards',`${g.streak||0}-day streak · ${g.points} points`,'')}${T('accounts','house','Accounts','Mobile money, banks, cash, SACCO',providerDebt()?'Advance or loan owed':'')}${T('family','people','Family & household',S.household?esc(S.household.name):'Personal and household spending','')}</div>
 <div class="sec-head"><h2>Money</h2></div>
 <div class="tiles">${T('spending','chart','Spending','Where the money goes, clearly','')}${T('budgets','target','Budgets','Monthly limits per category',over?`${over} over budget`:'')}${T('bills','calendar','Bills','Rent, utilities, school fees',`${late?late+' late · ':''}${soon} due this week`)}${T('goals','piggy','Savings goals','Progress to each goal','')}${T('lending','hand','Lending','Who owes you, who you owe','')}${T('invest','trend','Investments','SACCO, T-bills, unit trusts, NSSF','')}</div>
 <div class="sec-head"><h2>Learn and report</h2></div>
 <div class="tiles">${T('','book','Learn','Lessons and books on money','','openLearn')}${T('analytics','chart','Analytics & reports','Charts, Excel and PDF','')}</div>
 <div class="sec-head"><h2>Capture</h2></div>
 <div class="tiles">${T('scan','receipt','Scan a receipt','Photo to expense, read on the phone','')}${T('','sms','SMS reader','Test how messages are read','','smsTest')}${T('whatsapp','whatsapp','WhatsApp bot','Preview of the coming bot','')}${T('transport','bike','Transport fares','Boda and taxi price check','')}</div>
 <div class="sec-head"><h2>App</h2></div>
 <div class="list"><button class="setrow" data-go="settings"><span class="chip sm" style="--c:var(--accent)">${ic('gear',18)}</span><span class="grow"><b>Settings & privacy</b><span>Country, currency, language, lock, backup, export</span></span>${ic('chev',16)}</button><button class="setrow" data-act="lockNow"><span class="chip sm" style="--c:var(--accent)">${ic('lock',18)}</span><span class="grow"><b>Lock Kasente now</b><span>PIN or fingerprint to open</span></span>${ic('chev',16)}</button><button class="setrow" data-act="onboard"><span class="chip sm" style="--c:var(--accent)">${ic('sparkle',18)}</span><span class="grow"><b>Replay the welcome tour</b><span>The first screens again</span></span>${ic('chev',16)}</button></div>`};
ACT.openLearn=()=>{S.ui.adv='learn';go('advisor')};
const baseTransport=SCREENS.transport;SCREENS.transport=()=>(country()[0]!=='UG'?`<div class="note">${ic('info')}<span class="small">The fare reference covers Uganda for now. Add the routes you use in your city with "Add route" and Kasente will check your fares against them.</span></div>`:'')+baseTransport();
const baseInvest3=SCREENS.invest;SCREENS.invest=()=>`<div class="note">${ic('sms')}<span class="small">Kasente picks up confirmation messages from Xeno, NSSF, unit trust managers and similar, updates the holding and lets you know.</span></div>`+baseInvest3();

/* ---------- render, start-up and resume ---------- */
const baseRender3=window.render;
window.render=function(keep){baseRender3(keep);const c=cur();if(c==='activity'){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',b.dataset.nav==='spending'))}if(S.mode&&!render._chk){render._chk=1;setTimeout(()=>{render._chk=0;gameChecks()},2000)}};
const baseBoot=window.kasenteBoot;window.kasenteBoot=function(){baseBoot();if(S.mode){gameOpen();save()}setTimeout(()=>{if(window.kasenteReceiptReady)kasenteReceiptReady()},600);if(SCAN&&S.mode&&!$('#onb').hidden===false&&cur()!=='scan'&&SCAN.status!=='reading'&&(SCAN.items||[]).some(x=>x[0]||x[1]))toast('You have an unsaved receipt. Open More → Scan a receipt to finish it.','receipt')};
const baseResume3=window.kasenteOnResume;window.kasenteOnResume=away=>{baseResume3(away);if(S.mode){const k=ymd(TODAY0);if(!(G().days[k]||{}).o){gameOpen();refresh()}}};

kasenteBoot();
</script>
