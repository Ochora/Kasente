name: Build Kasente APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub's Ubuntu machines already include the Android SDK.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the APK
        env:
          KASENTE_MS_CLIENT_ID: ${{ secrets.KASENTE_MS_CLIENT_ID }}
        run: |
          echo "Android SDK: $ANDROID_HOME"
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log; then
            # Put the important lines where they show up as a readable error on the run page.
            msg=$(grep -E "error:|What went wrong|^> |Could not|FAILURE|Execution failed|AAPT|e: " build.log | head -80 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Build failed::$msg"
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "kasente-test-${{ github.run_number }}.apk"

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: kasente-test-${{ github.run_number }}
          path: kasente-test-*.apk

      - name: Publish it on the Releases page (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Kasente test build ${{ github.run_number }}
          prerelease: true
          files: kasente-test-*.apk
          body: |
            Test build ${{ github.run_number }} of Kasente.
            On your Android phone, tap the .apk file below, then allow installs from your browser if asked.
            Installing a newer build over this one keeps your data.
